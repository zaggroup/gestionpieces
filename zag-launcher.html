<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZAG — Centre</title>
<link rel="apple-touch-icon" href="zag-icon-192.png">
  <link rel="manifest" href="zag-manifest.json">
<meta name="theme-color" content="#0D1B2A">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Exo+2:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0D1B2A;--night2:#162436;--night3:#1E3148;
  --gold:#C9A84C;--gold2:#E8C96A;--gold-dim:rgba(201,168,76,.15);
  --green:#2E7D32;--green2:#43A047;--green-dim:rgba(46,125,50,.15);
  --blue:#1565C0;--blue2:#1E88E5;--blue-dim:rgba(21,101,192,.15);
  --pur:#6A1B9A;--pur2:#8E24AA;--pur-dim:rgba(106,27,154,.15);
  --text:#F5F0E8;--text2:rgba(245,240,232,.65);--text3:rgba(245,240,232,.35);
  --bd:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Exo 2',sans-serif;background:linear-gradient(160deg,#07111c,#0D1B2A,#162436);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

.star-bg{position:fixed;inset:0;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.star-bg svg{width:min(95vw,95vh);opacity:.04;animation:rot 180s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.wrap{position:relative;z-index:1;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:28px}

.brand{text-align:center}
.brand-logo{width:78px;height:78px;border-radius:18px;background:var(--gold-dim);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.7rem;color:var(--gold);margin:0 auto 14px;letter-spacing:1px}
.brand-name{font-weight:900;font-size:1.8rem;letter-spacing:2px;color:var(--gold)}
.brand-sub{font-size:.78rem;color:var(--text2);margin-top:4px}
.brand-devise{font-family:'Amiri',serif;font-size:.85rem;color:var(--text3);margin-top:10px;direction:rtl}

.menu{width:100%;display:flex;flex-direction:column;gap:12px}
.menu-btn{
  width:100%;padding:18px 18px;border-radius:18px;border:1.5px solid var(--bd);
  background:rgba(255,255,255,.04);cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:16px;transition:all .25s;
  color:var(--text);text-decoration:none
}
.menu-btn:active{transform:scale(.97)}
.mb-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.mb-icon.gold{background:var(--gold-dim);border:1.5px solid var(--gold)}
.mb-icon.green{background:var(--green-dim);border:1.5px solid var(--green2)}
.mb-icon.blue{background:var(--blue-dim);border:1.5px solid var(--blue2)}
.mb-text{flex:1}
.mb-title{font-family:'Exo 2',sans-serif;font-weight:800;font-size:.95rem}
.mb-sub{font-size:.7rem;color:var(--text2);margin-top:2px}
.mb-arrow{color:var(--text3);font-size:1.1rem}

.footer-link{
  font-size:.7rem;color:var(--text3);text-decoration:underline;
  background:none;border:none;cursor:pointer;font-family:'Exo 2',sans-serif
}
.version{font-size:.6rem;color:var(--text3);margin-top:4px}
</style>
</head>
<body>

<div class="star-bg">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 10L112 80L178 52L140 110L190 130L122 140L130 200L100 152L70 200L78 140L10 130L60 110L22 52L88 80Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="35" fill="none" stroke="currentColor" stroke-width="1"/>
    <circle cx="100" cy="100" r="58" fill="none" stroke="currentColor" stroke-width=".5"/>
  </svg>
</div>

<div class="wrap">
  <div class="brand">
    <div class="brand-logo" style="overflow:hidden;border-radius:16px"><img src="zag-icon-192.png" style="width:100%;height:100%;object-fit:cover;display:block"></div>
    <div class="brand-name">ZAG</div>
    <div class="brand-sub">Zone d'Abondance Globale — Kindia</div>
    <div class="brand-devise">الإيمان · العلم · العمل · البركة</div>
  </div>

  <div class="menu">
    <a class="menu-btn" href="zag-directeur.html">
      <div class="mb-icon gold">🕌</div>
      <div class="mb-text">
        <div class="mb-title">Direction</div>
        <div class="mb-sub">Élèves, internat, finances, vue d'ensemble</div>
      </div>
      <div class="mb-arrow">›</div>
    </a>

    <a class="menu-btn" href="zag-enseignant.html">
      <div class="mb-icon green">📖</div>
      <div class="mb-text">
        <div class="mb-title">Enseignant</div>
        <div class="mb-sub">Séances, leçons à valider, élèves</div>
      </div>
      <div class="mb-arrow">›</div>
    </a>

    <a class="menu-btn" href="zag-scanner.html">
      <div class="mb-icon blue">✅</div>
      <div class="mb-text">
        <div class="mb-title">Pointage (tablette)</div>
        <div class="mb-sub">Arrivées et départs des élèves</div>
      </div>
      <div class="mb-arrow">›</div>
    </a>
  </div>

  <div style="text-align:center">
    <button class="footer-link" onclick="window.location.href='zag-vitrine.html'">Voir la vitrine publique</button>
    <div class="version">ZAG Centre — v1.0 — Kindia, Guinée</div>
  </div>
</div>

<script>
// Enregistrement du Service Worker pour le mode hors-ligne (PWA)
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('zag-sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
