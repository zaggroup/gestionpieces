<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificat Hifz — Centre ZAG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Exo+2:wght@400;700;900&display=swap" media="print" onload="this.media='all'">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;background:#0D1B2A;color:#F0EAD6;font-family:'Exo 2',sans-serif}

.screen-ui{padding:16px;max-width:520px;margin:0 auto}
.btn-print{width:100%;margin-top:12px;background:linear-gradient(135deg,#C9A84C,#E8C96A);color:#0D1B2A;border:none;border-radius:12px;padding:14px;font-size:.85rem;font-weight:900;cursor:pointer;font-family:'Exo 2',sans-serif}
.btn-wa{width:100%;margin-top:8px;background:rgba(37,211,102,.15);border:1px solid #25D366;color:#25D366;border-radius:12px;padding:12px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:'Exo 2',sans-serif}
.btn-back{width:100%;margin-top:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(240,234,214,.6);border-radius:12px;padding:11px;font-size:.75rem;cursor:pointer;font-family:'Exo 2',sans-serif}

/* Le certificat lui-même */
.cert-wrapper{background:#0D1B2A;padding:8px}
.cert{
  width:100%;max-width:520px;margin:0 auto;
  background:linear-gradient(160deg,#0D1B2A 0%,#0f2235 40%,#0D1B2A 100%);
  border:3px solid #C9A84C;border-radius:16px;
  padding:24px 20px;
  position:relative;overflow:hidden;
}
/* Filigrane étoile */
.cert::before{
  content:'✦';position:absolute;
  font-size:220px;color:rgba(201,168,76,.04);
  top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;line-height:1
}
/* Bordure décorative interne */
.cert-border{
  border:1px solid rgba(201,168,76,.25);border-radius:12px;
  padding:20px 16px;
}
/* En-tête */
.cert-school{font-family:'Amiri',serif;font-size:1.3rem;color:#C9A84C;text-align:center;font-weight:700;margin-bottom:2px}
.cert-school-fr{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:rgba(201,168,76,.6);text-align:center;margin-bottom:4px}
.cert-divider{width:80px;height:2px;background:linear-gradient(90deg,transparent,#C9A84C,transparent);margin:10px auto}

/* Titre certificat */
.cert-type-ar{font-family:'Amiri',serif;font-size:1.6rem;color:#E8C96A;text-align:center;direction:rtl;margin:10px 0 2px}
.cert-type-fr{font-size:.72rem;text-transform:uppercase;letter-spacing:2px;color:rgba(232,201,106,.7);text-align:center;margin-bottom:12px}

/* Corps */
.cert-intro{font-size:.72rem;color:rgba(240,234,214,.6);text-align:center;line-height:1.6;margin-bottom:10px}
.cert-name{font-family:'Amiri',serif;font-size:1.6rem;color:#F0EAD6;text-align:center;font-weight:700;margin:10px 0 2px;border-bottom:1px solid rgba(201,168,76,.3);padding-bottom:8px}
.cert-name-ar{font-family:'Amiri',serif;font-size:1.1rem;color:rgba(201,168,76,.8);text-align:center;direction:rtl;margin-bottom:10px}

.cert-achievement{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:10px;padding:12px;text-align:center;margin:10px 0}
.cert-achievement-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:rgba(201,168,76,.6);margin-bottom:4px}
.cert-achievement-value{font-family:'Amiri',serif;font-size:1.25rem;color:#E8C96A;font-weight:700}
.cert-achievement-ar{font-family:'Amiri',serif;font-size:.9rem;color:rgba(232,201,106,.7);direction:rtl;margin-top:2px}

.cert-date{font-size:.65rem;color:rgba(240,234,214,.4);text-align:center;margin:10px 0}

/* Versets décoratif */
.cert-aya{font-family:'Amiri',serif;font-size:.95rem;color:rgba(201,168,76,.5);text-align:center;direction:rtl;font-style:italic;line-height:1.7;margin:10px 0;padding:8px;border-top:1px solid rgba(201,168,76,.15);border-bottom:1px solid rgba(201,168,76,.15)}

/* Sceau */
.cert-seal{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
.cert-seal-logo{width:50px;height:50px;border-radius:50%;background:rgba(201,168,76,.1);border:2px solid rgba(201,168,76,.4);display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:1.4rem;color:#C9A84C;flex-shrink:0}
.cert-seal-text{font-size:.62rem;color:rgba(240,234,214,.4);line-height:1.6;text-align:center;flex:1}
.cert-seal-qr{width:50px;height:50px;border:1px solid rgba(201,168,76,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.5rem;color:rgba(201,168,76,.5);text-align:center;flex-shrink:0;padding:2px}

/* Numéro certificat */
.cert-number{font-family:monospace;font-size:.6rem;color:rgba(201,168,76,.4);text-align:center;margin-top:8px}

/* Print */
@media print{
  body{background:white;color:#000}
  .screen-ui .btn-print,.screen-ui .btn-wa,.screen-ui .btn-back,.screen-ui h2{display:none}
  .cert{border-color:#8B6914;background:white;page-break-inside:avoid}
  .cert::before{color:rgba(139,105,20,.04)}
  .cert-school,.cert-type-ar,.cert-name,.cert-achievement-value{color:#8B6914}
  .cert-name-ar,.cert-type-fr,.cert-school-fr{color:rgba(139,105,20,.7)}
  .cert-intro,.cert-date,.cert-seal-text,.cert-number{color:rgba(0,0,0,.5)}
  .cert-achievement{background:rgba(139,105,20,.06);border-color:rgba(139,105,20,.2)}
  .cert-aya{color:rgba(139,105,20,.6);border-color:rgba(139,105,20,.2)}
  .cert-seal-logo{background:rgba(139,105,20,.1);border-color:rgba(139,105,20,.4);color:#8B6914}
  .cert-divider{background:linear-gradient(90deg,transparent,#8B6914,transparent)}
  .cert-border{border-color:rgba(139,105,20,.25)}
  .cert-seal-qr{border-color:rgba(139,105,20,.3);color:rgba(139,105,20,.5)}
  .cert-name,.cert-achievement-ar{color:rgba(0,0,0,.8)}
}

.loader{text-align:center;padding:40px;color:rgba(240,234,214,.5)}
.spinner{width:30px;height:30px;border:2px solid rgba(201,168,76,.2);border-top:2px solid #C9A84C;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="screen-ui">
  <div id="certContent"><div class="loader"><div class="spinner"></div>Chargement du certificat…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var ECOLE_ID = "alhikma_kindia";

var firebaseConfig = {
  apiKey: "AIzaSyDWF-Q3S2M-btrRBHBYzd9dVbY6iEg_fNk",
  authDomain: "gestionpieces-74559.firebaseapp.com",
  projectId: "gestionpieces-74559",
  storageBucket: "gestionpieces-74559.appspot.com",
  messagingSenderId: "392970031226",
  appId: "1:392970031226:web:68bb9966b4440576a2ebc3"
};

var SOURATES = [
  {n:1,nom:"Al-Fatiha",v:7,ar:"الفاتحة"},{n:2,nom:"Al-Baqara",v:286,ar:"البقرة"},{n:3,nom:"Al-Imran",v:200,ar:"آل عمران"},
  {n:4,nom:"An-Nisa",v:176,ar:"النساء"},{n:18,nom:"Al-Kahf",v:110,ar:"الكهف"},{n:19,nom:"Maryam",v:98,ar:"مريم"},
  {n:36,nom:"Ya-Sin",v:83,ar:"يس"},{n:55,nom:"Ar-Rahman",v:78,ar:"الرحمن"},{n:67,nom:"Al-Mulk",v:30,ar:"الملك"},
  {n:78,nom:"An-Naba",v:40,ar:"النبأ"},{n:112,nom:"Al-Ikhlas",v:4,ar:"الإخلاص"},{n:113,nom:"Al-Falaq",v:5,ar:"الفلق"},
  {n:114,nom:"An-Nas",v:6,ar:"الناس"}
];

var params = new URLSearchParams(window.location.search);
var ELEVE_ID = params.get('id');
var CERT_ID = params.get('cert');

function escHtml(s){ return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function erreur(msg){ document.getElementById('certContent').innerHTML='<div style="text-align:center;padding:40px;color:rgba(239,83,80,.8)">⚠️ '+msg+'</div>'; }

window.addEventListener('load', function(){
  if(!ELEVE_ID && !CERT_ID){ erreur('Lien invalide'); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();
    chargerCertificat(db);
  } catch(e){ erreur('Erreur Firebase: '+e.message); }
});

function chargerCertificat(db){
  if(CERT_ID){
    // Charger depuis la collection certifications
    db.collection('zag_certifications').doc(CERT_ID).get().then(function(doc){
      if(!doc.exists){ erreur('Certificat introuvable'); return; }
      var c = doc.data();
      db.collection('zag_eleves').doc(c.eleveId).get().then(function(edoc){
        var e = edoc.exists ? Object.assign({id:edoc.id},edoc.data()) : {nom:c.eleveNom||'—',prenom:''};
        afficherCertificat(e, c, CERT_ID);
      });
    });
  } else {
    // Charger le dernier certificat de cet élève
    db.collection('zag_eleves').doc(ELEVE_ID).get().then(function(doc){
      if(!doc.exists){ erreur('Élève introuvable'); return; }
      var e = Object.assign({id:doc.id},doc.data());
      // Charger les leçons pour générer un certificat à la volée
      db.collection('zag_signalements_lecon').where('ecoleId','==',ECOLE_ID).where('eleveId','==',ELEVE_ID).where('statut','==','confirme').limit(100).get().then(function(snap){
      snap = {docs: snap.docs.sort(function(a,b){ var da=a.data().date, db2=b.data().date; var ta=da&&da.seconds?da.seconds*1000:new Date(da||0).getTime(); var tb=db2&&db2.seconds?db2.seconds*1000:new Date(db2||0).getTime(); return tb-ta; })};
        var lecons = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
        // Calculer les versets mémorisés totaux
        var totalVersets = lecons.reduce(function(acc,l){
          if(l.lecon_nouvelle&&l.lecon_nouvelle.debut&&l.lecon_nouvelle.fin) return acc+Math.max(0,l.lecon_nouvelle.fin-l.lecon_nouvelle.debut+1);
          return acc;
        },0);
        // Dernière leçon confirmée pour le nom de la sourate
        var dernierLecon = lecons[0];
        var certData = {
          eleveId: ELEVE_ID,
          eleveNom: (e.prenom||'')+' '+(e.nom||''),
          eleveNomAr: (e.prenom_ar||'')+' '+(e.nom_ar||''),
          type: 'progression',
          versetsMemorises: totalVersets,
          nbLecons: lecons.length,
          derniereSourate: dernierLecon&&dernierLecon.lecon_nouvelle ? 'Sourate '+dernierLecon.lecon_nouvelle.sourate : null,
          dateEmission: new Date().toISOString().split('T')[0]
        };
        afficherCertificat(e, certData, null);
      });
    });
  }
}

function afficherCertificat(eleve, cert, certId){
  var dateAff = cert.dateEmission ? new Date(cert.dateEmission).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}) : new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  var num = certId || ('ZAG-CERT-'+(eleve.numero||eleve.id.slice(0,6).toUpperCase())+'-'+new Date().getFullYear());
  var achievement, achievementAr, ayat;
  if(cert.type==='sourate'){
    achievement = 'A mémorisé la sourate '+escHtml(cert.sourate||'—');
    achievementAr = '﴾ حفظ سورة '+escHtml(cert.sourateAr||cert.sourate||'—')+' ﴿';
    ayat = '﴾ وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ ﴿';
  } else if(cert.type==='juz'){
    achievement = 'A mémorisé le Juz '+escHtml(String(cert.juz||'—'));
    achievementAr = '﴾ حفظ الجزء '+escHtml(String(cert.juz||'—'))+' ﴿';
    ayat = '﴾ إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ ﴿';
  } else {
    achievement = (cert.versetsMemorises||0).toLocaleString()+' versets mémorisés · '+(cert.nbLecons||0)+' leçons confirmées';
    achievementAr = '﴾ حفظ '+(cert.versetsMemorises||0)+' آية ﴿';
    ayat = '﴾ اقْرَأْ وَرَبُّكَ الْأَكْرَمُ · الَّذِي عَلَّمَ بِالْقَلَمِ ﴿';
  }

  var html = '<div class="cert-wrapper">'
    +'<div class="cert" id="theCert">'
    +'<div class="cert-border">'
    +'<div class="cert-school">مركز زاج الحكمة</div>'
    +'<div class="cert-school-fr">Centre ZAG Al-Hikma · Kindia, Guinée</div>'
    +'<div class="cert-divider"></div>'
    +'<div class="cert-type-ar">شهادة تكريم</div>'
    +'<div class="cert-type-fr">Certificat d\'honneur — Hifz Al-Quran</div>'
    +'<div class="cert-intro">Le Centre ZAG Al-Hikma atteste avec fierté que</div>'
    +'<div class="cert-name">'+escHtml((eleve.prenom||'')+' '+(eleve.nom||''))+'</div>'
    +(eleve.prenom_ar||eleve.nom_ar ? '<div class="cert-name-ar">'+escHtml((eleve.prenom_ar||'')+' '+(eleve.nom_ar||''))+'</div>' : '')
    +'<div class="cert-achievement">'
    +'<div class="cert-achievement-label">A accompli</div>'
    +'<div class="cert-achievement-value">'+achievement+'</div>'
    +'<div class="cert-achievement-ar">'+achievementAr+'</div>'
    +'</div>'
    +'<div class="cert-aya">'+ayat+'</div>'
    +'<div class="cert-date">Délivré le '+dateAff+' à Kindia, République de Guinée</div>'
    +'<div class="cert-seal">'
    +'<div class="cert-seal-logo"><img src="zag-icon-192.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block"></div>'
    +'<div class="cert-seal-text">Centre ZAG Al-Hikma<br>الإيمان · العلم · العمل · البركة<br><span style="font-size:.55rem">Signé par le Directeur</span></div>'
    +'<div class="cert-seal-qr" id="certQRDiv"><div id="certQRCode" style="width:50px;height:50px"></div></div>'
    +'</div>'
    +'<div class="cert-number">N° '+escHtml(num)+'</div>'
    +'</div>'
    +'</div>'
    +'</div>'
    +'<button class="btn-print" onclick="window.print()">🖨️ Imprimer / Sauvegarder en PDF</button>'
    +'<button class="btn-wa" onclick="partagerWA(\''+escHtml(num)+'\',\''+escHtml((eleve.prenom||'')+' '+(eleve.nom||''))+'\',\''+escHtml(achievement)+'\')">📱 Partager sur WhatsApp</button>'
    +'<button class="btn-back" onclick="history.back()">← Retour au portail parent</button>';

  document.getElementById('certContent').innerHTML = html;
  // Générer le QR code de vérification
  setTimeout(function(){
    var qrDiv = document.getElementById('certQRCode');
    if(qrDiv && typeof QRCode !== 'undefined'){
      var verifyUrl = window.location.origin + window.location.pathname + '?cert=' + encodeURIComponent(num);
      try {
        new QRCode(qrDiv, {text:verifyUrl, width:50, height:50, colorDark:'#0D1B2A', colorLight:'#F5F0E8'});
      } catch(e){}
    }
  }, 300);
}

function partagerWA(num, nom, achievement){
  var baseUrl = window.location.href.replace(/\?.*$/,'');
  var lien = baseUrl+'?cert='+encodeURIComponent(num);
  var msg = '🌟 *Félicitations !*\n\n'
    +'L\'élève *'+nom+'* du Centre ZAG Al-Hikma vient de recevoir\nson *Certificat Hifz Al-Quran* !\n\n'
    +'✅ '+achievement+'\n\n'
    +'_بَارَكَ اللَّهُ فِيكُمْ — Barakallahu fikum_\n\n'
    +'🔗 Voir le certificat :\n'+lien;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
</script>
</body>
</html>
