function fmt(n) { return Math.round(n || 0).toLocaleString('fr-FR'); }

function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":"&#39;" }[c];
  });
}

function fmtDate(ts) {
  return ts && ts.toDate
    ? ts.toDate().toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
    : '—';
}

function fmtDateCourt(ts) {
  if (!ts || !ts.toDate) return '—';
  var d = ts.toDate();
  var now = new Date();
  var diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return "Aujourd'hui " + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  if (diff === 1) return 'Hier ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
}

function genRecu() {
  return 'ZAG-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random() * 9000) + 1000);
}

function today() { return new Date().toDateString(); }
function todayStr() { return new Date().toDateString(); }
function yesterStr() { return new Date(Date.now() - 86400000).toDateString(); }
function daysAgo(n) { return new Date(Date.now() - n * 86400000); }
function startOfMonth() { var d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; }
function startOfYear()  { var d = new Date(); d.setMonth(0,1); d.setHours(0,0,0,0); return d; }

function showToast(msg, isErr) {
  var t = document.getElementById('toast');
  if (!t) {
    // Créer le toast s'il n'existe pas
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);' +
      'background:#1a472a;color:#fff;padding:12px 20px;border-radius:12px;font-size:.85rem;' +
      'font-weight:600;z-index:9999;display:none;max-width:90vw;text-align:center;' +
      'box-shadow:0 4px 20px rgba(0,0,0,.3);';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = isErr ? '#c62828' : '#1a472a';
  t.style.display = 'block';
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() {
    t.style.display = 'none';
    t.className = 'toast';
  }, 3500);
}

// ══════════════════════════════════════════════
// HASH PIN SHA-256 (Web Crypto API)
// ══════════════════════════════════════════════
async function hashPin(pin) {
  try {
    var enc = new TextEncoder().encode(String(pin));
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf))
      .map(function(b) { return b.toString(16).padStart(2, '0'); })
      .join('');
  } catch(e) {
    // Fallback si Web Crypto non disponible (très rare)
    return String(pin);
  }
}

// Vérifier un PIN : d'abord en mémoire (Firebase), puis via hash (hors-ligne)
async function verifierPin(code, role) {
  var inMemory = role === 'admin' ? ZAG.CODES.admin : ZAG.CODES.gest;
  // Code en clair en mémoire (Firebase disponible, ≤8 chars)
  if (inMemory && inMemory.length <= 8) {
    return code === inMemory;
  }
  // Fallback hash hors-ligne
  var savedHash = role === 'admin' ? ZAG.CODES_HASH.admin : ZAG.CODES_HASH.gest;
  if (!savedHash) return false;
  var h = await hashPin(code);
  return h === savedHash;
}

// ══════════════════════════════════════════════
// SESSION
// ══════════════════════════════════════════════
function saveSession(role, nom) {
  try {
    var sess = { role: role, nom: nom || '', expiry: Date.now() + ZAG.SESSION_MS };
    sessionStorage.setItem('zag_session', JSON.stringify(sess));
  } catch(e) {}
}

function getSession() {
  try {
    var sess = JSON.parse(sessionStorage.getItem('zag_session') || 'null');
    if (sess && Date.now() < sess.expiry) return sess;
  } catch(e) {}
  return null;
}

function clearSession() {
  try { sessionStorage.removeItem('zag_session'); } catch(e) {}
}

function renewSession() {
  try {
    var sess = JSON.parse(sessionStorage.getItem('zag_session') || 'null');
    if (sess) {
      sess.expiry = Date.now() + ZAG.SESSION_MS;
      sessionStorage.setItem('zag_session', JSON.stringify(sess));
    }
  } catch(e) {}
}

// Heartbeat : vérifie et renouvelle la session toutes les 30 min
function startSessionHeartbeat(onExpired) {
  return setInterval(function() {
    try {
      var sess = JSON.parse(sessionStorage.getItem('zag_session') || 'null');
      if (!sess || Date.now() >= sess.expiry) {
        showToast('⏱️ Session expirée — reconnexion requise', true);
        setTimeout(function() {
          if (onExpired) onExpired();
          else window.location.href = 'zaggroup-11.html';
        }, 2500);
      } else {
        renewSession();
      }
    } catch(e) {}
  }, ZAG.HEARTBEAT_MS);
}

// ══════════════════════════════════════════════
// FAKE DB (mode hors-ligne complet)
// ══════════════════════════════════════════════
function createFakeDb() {
  function makeFakeRef(name) {
    return {
      _name: name,
      onSnapshot: function(ok, err) {
        try {
          var items = JSON.parse(localStorage.getItem('zag_col_' + name) || '[]');
          ok({ docs: items.map(function(d) {
            return { id: d.id || ('local_' + Math.random()), data: function() { return d; } };
          })});
        } catch(e) { if (err) err(e); }
        return function() {}; // unsubscribe noop
      },
      get: function() {
        return Promise.resolve({
          exists: false, docs: [],
          forEach: function() {}, data: function() { return {}; }
        });
      },
      add: function(d) {
        try {
          var pending = JSON.parse(localStorage.getItem('zag_pending') || '[]');
          var item = Object.assign({}, d, { _col: name, _ts: Date.now(), id: 'local_' + Date.now() });
          pending.push(item);
          localStorage.setItem('zag_pending', JSON.stringify(pending));
          // Aussi sauvegarder dans la collection locale
          var items = JSON.parse(localStorage.getItem('zag_col_' + name) || '[]');
          items.unshift(item);
          localStorage.setItem('zag_col_' + name, JSON.stringify(items.slice(0, 500)));
        } catch(e) {}
        return Promise.resolve({ id: 'local_' + Date.now() });
      },
      doc: function(id) {
        var self = this;
        return {
          get: function() { return Promise.resolve({ exists: false, data: function() { return {}; } }); },
          set: function(data) {
            try {
              var items = JSON.parse(localStorage.getItem('zag_col_' + name) || '[]');
              var idx = items.findIndex(function(x) { return x.id === id; });
              if (idx > -1) items[idx] = Object.assign({}, items[idx], data);
              else items.unshift(Object.assign({ id: id }, data));
              localStorage.setItem('zag_col_' + name, JSON.stringify(items));
            } catch(e) {}
            return Promise.resolve();
          },
          update: function(data) { return this.set(data); },
          delete: function() {
            try {
              var items = JSON.parse(localStorage.getItem('zag_col_' + name) || '[]');
              localStorage.setItem('zag_col_' + name, JSON.stringify(items.filter(function(x) { return x.id !== id; })));
            } catch(e) {}
            return Promise.resolve();
          }
        };
      },
      orderBy: function() { return this; },
      where: function() { return this; },
      limit: function() { return this; }
    };
  }

  return {
    collection: function(name) { return makeFakeRef(name); },
    runTransaction: function(fn) {
      // Simuler une transaction en mode hors-ligne (pas de garantie atomique)
      var fakeTransaction = {
        get: function(ref) { return Promise.resolve({ exists: false, data: function() { return {}; } }); },
        set: function() {},
        update: function() {}
      };
      return fn(fakeTransaction).catch(function() {});
    },
    batch: function() {
      return {
        set: function() {}, update: function() {}, delete: function() {},
        commit: function() { return Promise.resolve(); }
      };
    }
  };
}

// ══════════════════════════════════════════════
// INIT FIREBASE (chargement dynamique des scripts)
// ══════════════════════════════════════════════
function initFirebase(onReady, onFallback) {
  if (!navigator.onLine) {
    ZAG.db = createFakeDb();
    ZAG.FIREBASE_OK = false;
    if (onFallback) onFallback();
    return;
  }

  var timeout = setTimeout(function() {
    if (!ZAG.FIREBASE_OK && !ZAG._appStarted) {
      ZAG.db = createFakeDb();
      ZAG._appStarted = true;
      if (onFallback) onFallback();
    }
  }, 5000);

  var s1 = document.createElement('script');
  s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onload = function() {
    var s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
    s2.onload = function() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(ZAG_FIREBASE_CONFIG);
        }
        ZAG.db = firebase.firestore();
        ZAG.FIREBASE_OK = true;
        clearTimeout(timeout);

        // enablePersistence pour le cache hors-ligne
        ZAG.db.enablePersistence({ synchronizeTabs: true })
          .catch(function(e) {
            if (e.code === 'failed-precondition') {
              console.warn('ZAG: Persistance — plusieurs onglets ouverts');
            }
          });

        // Charger les codes depuis Firestore et sauvegarder les hash
        ZAG.db.collection('app_config').doc('codes').get().then(function(doc) {
          if (doc.exists) {
            var d = doc.data();
            if (d.gest)  ZAG.CODES.gest  = d.gest;
            if (d.admin) ZAG.CODES.admin = d.admin;
            // Sauvegarder hash pour mode hors-ligne
            Promise.all([hashPin(ZAG.CODES.gest), hashPin(ZAG.CODES.admin)])
              .then(function(hashes) {
                try {
                  localStorage.setItem('zag_codes_hash', JSON.stringify({
                    gest: hashes[0], admin: hashes[1]
                  }));
                  ZAG.CODES_HASH.gest  = hashes[0];
                  ZAG.CODES_HASH.admin = hashes[1];
                } catch(e) {}
              });
          }
        }).catch(function() {});

        if (!ZAG._appStarted) {
          ZAG._appStarted = true;
          if (onReady) onReady(ZAG.db);
        }
      } catch(e) {
        clearTimeout(timeout);
        ZAG.db = createFakeDb();
        if (!ZAG._appStarted) {
          ZAG._appStarted = true;
          if (onFallback) onFallback();
        }
      }
    };
    s2.onerror = function() {
      clearTimeout(timeout);
      ZAG.db = createFakeDb();
      if (!ZAG._appStarted) { ZAG._appStarted = true; if (onFallback) onFallback(); }
    };
    document.head.appendChild(s2);
  };
  s1.onerror = function() {
    clearTimeout(timeout);
    ZAG.db = createFakeDb();
    if (!ZAG._appStarted) { ZAG._appStarted = true; if (onFallback) onFallback(); }
  };
  document.head.appendChild(s1);
}

// ══════════════════════════════════════════════

// ══════════════════════════════════════════════
function updateSyncBanner() {
  var pending = [];
  try { pending = JSON.parse(localStorage.getItem('zag_sorties_pending') || '[]'); } catch(e) {}
  var pendingE = [];
  try { pendingE = JSON.parse(localStorage.getItem('zag_entrees_pending') || '[]'); } catch(e) {}
  var total = pending.length + pendingE.length;
  var banner = document.getElementById('syncBanner');
  var count  = document.getElementById('syncCount');
  if (!banner) return;
  if (total > 0) {
    banner.style.display = 'block';
    if (count) count.textContent = total + ' opération(s) en attente de sync';
  } else {
    banner.style.display = 'none';
  }
}

  }).catch(function() {});
}

// ══════════════════════════════════════════════
// WHATSAPP HELPERS
// ══════════════════════════════════════════════
function ouvrirWhatsApp(message) {
  var url = 'https://wa.me/' + ZAG.WHATSAPP_NUM + '?text=' + encodeURIComponent(message);
  window.open(url, '_blank');
}

// ══════════════════════════════════════════════
// COMPRESSION IMAGE (Base64)
// ══════════════════════════════════════════════
function compresserImage(file, maxW, maxH, qualite, callback) {
  maxW    = maxW    || 400;
  maxH    = maxH    || 400;
  qualite = qualite || 0.7;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', qualite));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ══════════════════════════════════════════════
// CONNECTIVITÉ
// ══════════════════════════════════════════════
function setConnStatus(ok) {
  var dot = document.getElementById('connDot');
  var lbl = document.getElementById('connLabel');
  if (dot) dot.className = 'status-dot ' + (ok ? 'dot-green' : 'dot-orange');
  if (lbl) lbl.textContent = ok ? 'Firebase connecté' : 'Mode hors-ligne';
}

window.addEventListener('online',  function() { setConnStatus(ZAG.FIREBASE_OK); });
window.addEventListener('offline', function() { setConnStatus(false); });

// ══════════════════════════════════════════════
// HORODATAGE CACHE
// ══════════════════════════════════════════════
function marquerCacheFrais() {
  try { localStorage.setItem('zag_cache_ts', String(Date.now())); } catch(e) {}
}

function getCacheAge() {
  try {
    var ts = parseInt(localStorage.getItem('zag_cache_ts') || '0');
    return ts > 0 ? Date.now() - ts : Infinity;
  } catch(e) { return Infinity; }
}

      s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
      s2.onload=function(){
        try{
          if(!firebase.apps.length) firebase.initializeApp(ZAG_FIREBASE_CONFIG);
          db=ZAG.db=firebase.firestore();
          FIREBASE_OK=ZAG.FIREBASE_OK=true;
          setConnStatus(true);
          chargerCodes();
        }catch(e){ setConnStatus(false); }
      };
      s2.onerror=function(){ setConnStatus(false); };
      document.head.appendChild(s2);
    };
    s1.onerror=function(){ setConnStatus(false); };
    document.head.appendChild(s1);
  })();
}else{ setConnStatus(false); }

function setConnStatus(ok){
  var dot=document.getElementById('connDot');
  var lbl=document.getElementById('connLabel');
  if(!dot) return;
  if(ok){ dot.className='status-dot dot-green'; lbl.textContent='Firebase connect\u00e9'; }
  else{ dot.className='status-dot dot-orange'; lbl.textContent='Mode hors-ligne'; }
}

function chargerCodes(){
  if(!db||!FIREBASE_OK) return;
  db.collection('app_config').doc('codes').get().then(function(doc){
    if(doc.exists){
      var d=doc.data();
      if(d.gest) CODES.gest=d.gest;
      if(d.admin) CODES.admin=d.admin;
      try{ localStorage.setItem('zag_codes',JSON.stringify({gest:CODES.gest,admin:CODES.admin})); }catch(e){}
    }
  }).catch(function(){});
}

// -- Rate limiting --
function getAttempts(role){
  try{ return JSON.parse(localStorage.getItem('zag_att_'+role)||'{"n":0,"until":0}'); }
  catch(e){ return {n:0,until:0}; }
}
function saveAttempts(role,data){
  try{ localStorage.setItem('zag_att_'+role,JSON.stringify(data)); }catch(e){}
}
function recordFail(role){
  var a=getAttempts(role);
  a.n=(a.n||0)+1;
  var delays=[0,0,30,60,120,300,600];
  var delay=delays[Math.min(a.n,delays.length-1)];
  a.until=Date.now()+(delay*1000);
  saveAttempts(role,a);
  return a;
}
function resetAttempts(role){
  saveAttempts(role,{n:0,until:0});
}
function isBlocked(role){
  var a=getAttempts(role);
  return Date.now()<a.until;
}
function blockSecondsLeft(role){
  var a=getAttempts(role);
  return Math.max(0,Math.ceil((a.until-Date.now())/1000));
}

// -- Session --
function saveSession(role,nom){
  try{
    var sess={role:role,nom:nom||'',expiry:Date.now()+SESSION_DURATION};
    sessionStorage.setItem('zag_session',JSON.stringify(sess));
  }catch(e){}
}
function getSession(){
  try{
    var sess=JSON.parse(sessionStorage.getItem('zag_session')||'null');
    if(sess&&Date.now()<sess.expiry) return sess;
  }catch(e){}
  return null;
}
function clearSession(){
  try{ sessionStorage.removeItem('zag_session'); }catch(e){}
}

// -- Session resume --
var sess=getSession();
if(sess){
  var sb=document.getElementById('sessionBanner');
  if(sb){
    sb.classList.add('show');
    var role_lbl=sess.role==='admin'?'Administrateur':'Gestionnaire';
    var nomAff=(sess.nom&&isNaN(sess.nom))?(' — '+sess.nom):'';document.getElementById('sessInfo').textContent=role_lbl+nomAff+' (session active)';
  }
}

function resumeSession(){
  var s=getSession();
  if(!s){ clearSessionBanner(); return; }
  saveSession(s.role,s.nom);
  if(s.role==='admin'){
    sessionStorage.setItem('zagAdmin','1');
    window.location.href='patron-19.html';
  }else{
    sessionStorage.setItem('zagNom',s.nom);
    window.location.href='gestionnaire_new-2-7.html';
  }
}
function clearSessionBanner(){
  clearSession();
  var sb=document.getElementById('sessionBanner');
  if(sb) sb.classList.remove('show');
}

// -- PIN Screen --
var currentRole=null;
var blockInterval=null;

function openPin(role){
  currentRole=role;
  var isAdm=role==='admin';
  document.getElementById('pinTitle').textContent=isAdm?'Acc\u00e8s Administrateur':'Acc\u00e8s Gestionnaire';
  document.getElementById('pinRoleBadge').textContent=isAdm?'Admin':'Gestionnaire';
  document.getElementById('nomField').style.display=isAdm?'none':'block';
  document.getElementById('pinCode').value='';
  document.getElementById('pinNom').value='';
  document.getElementById('pinErr').textContent='';
  document.getElementById('pinAttemptsInfo').textContent='';
  document.getElementById('pinBlock').style.display='none';
  // Pre-fill last name for gestionnaire
  if(!isAdm){
    try{
      var lastNom=localStorage.getItem('zag_last_nom')||'';
      document.getElementById('pinNom').value=lastNom;
    }catch(e){}
  }
  // Check if blocked
  if(isBlocked(role)){
    showBlock(role);
  }
  document.getElementById('pinScreen').classList.add('show');
  setTimeout(function(){
    var focus_el=isAdm?document.getElementById('pinCode'):(document.getElementById('pinNom').value?document.getElementById('pinCode'):document.getElementById('pinNom'));
    focus_el.focus();
  },300);
}

function closePin(){
  document.getElementById('pinScreen').classList.remove('show');
  currentRole=null;
  if(blockInterval){ clearInterval(blockInterval); blockInterval=null; }
}

function showBlock(role){
  var blockEl=document.getElementById('pinBlock');
  var timerEl=document.getElementById('pinBlockTimer');
  var submitEl=document.getElementById('pinSubmit');
  blockEl.style.display='block';
  submitEl.disabled=true;
  if(blockInterval) clearInterval(blockInterval);
  blockInterval=setInterval(function(){
    var left=blockSecondsLeft(role);
    if(left<=0){
      clearInterval(blockInterval); blockInterval=null;
      blockEl.style.display='none';
      submitEl.disabled=false;
      timerEl.textContent='';
    }else{
      var m=Math.floor(left/60), s=left%60;
      timerEl.textContent=(m>0?m+'min ':'')+s+'s';
    }
  },500);
}

document.getElementById('pinSubmit').addEventListener('click',function(){
  if(this.disabled) return;
  var code=document.getElementById('pinCode').value.trim();
  var nom=document.getElementById('pinNom').value.trim();
  var errEl=document.getElementById('pinErr');
  var attEl=document.getElementById('pinAttemptsInfo');
  if(!code){errEl.textContent='Entrez votre code PIN.';return;}
  if(currentRole==='gest'&&!nom){errEl.textContent='Entrez votre pr\u00e9nom.';return;}
  if(isBlocked(currentRole)){showBlock(currentRole);return;}
  var expected=currentRole==='admin'?CODES.admin:CODES.gest;
  if(code!==expected){
    var att=recordFail(currentRole);
    document.getElementById('pinCode').value='';
    document.getElementById('pinCode').classList.add('shake');
    setTimeout(function(){document.getElementById('pinCode').classList.remove('shake');},400);
    var left=blockSecondsLeft(currentRole);
    if(left>0){
      errEl.textContent='Code incorrect. Blocage activ\u00e9.';
      showBlock(currentRole);
    }else{
      var remaining=3-((att.n)%3);
      if(remaining<3) attEl.textContent='Attention : encore '+remaining+' essai(s) avant blocage.';
      errEl.textContent='Code incorrect.';
    }
    return;
  }
  // Succès
  resetAttempts(currentRole);
  if(currentRole==='gest'){
    try{ localStorage.setItem('zag_last_nom',nom); }catch(e){}
    var nomFinal=(nom&&isNaN(nom))?nom:'Gestionnaire';saveSession('gest',nomFinal);
    sessionStorage.setItem('zagNom',nomFinal);
    closePin();
    proposerEmpreinte('gest').then(function(){window.location.href='gestionnaire_new-2-7.html';});
  }else{
    saveSession('admin','Admin');
    sessionStorage.setItem('zagAdmin','1');
    closePin();
    proposerEmpreinte('admin').then(function(){window.location.href='patron-19.html';});
  }
});

document.getElementById('pinCode').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('pinSubmit').click();
});
document.getElementById('pinNom').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('pinCode').focus();
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    reg.addEventListener('updatefound',function(){
      var nSW=reg.installing;
      if(nSW) nSW.addEventListener('statechange',function(){
        if(nSW.state==='installed'&&navigator.serviceWorker.controller) nSW.postMessage({type:'SKIP_WAITING'});
      });
    });
  }).catch(function(){});
}

// Connection status init
setTimeout(function(){
  if(!FIREBASE_OK) setConnStatus(false);
},3000);
updateFpButtons();


// ===== EMPREINTE DIGITALE (WebAuthn) =====
var FP_SUPPORTED = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);

function bufToB64(buf){
  return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
}
function b64ToBuf(b64){
  var bin=atob(b64);
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr.buffer;
}

function fpRegistered(role){
  try{ return !!localStorage.getItem('zag_fp_cred_'+role); }catch(e){ return false; }
}

async function registerFingerprint(role){
  if(!FP_SUPPORTED){
    var isChrome=navigator.userAgent.indexOf('Chrome')>-1&&navigator.userAgent.indexOf('Edg')===-1;
    if(!isChrome){
      alert('\u26a0\uFE0F Empreinte non disponible.\n\nUtilisez Google Chrome sur Android pour activer cette fonctionnalit\u00e9.');
    } else {
      alert('\u26a0\uFE0F Votre appareil ne supporte pas l\'authentification biom\u00e9trique.');
    }
    return false;
  }
  try{
    var challenge = crypto.getRandomValues(new Uint8Array(32));
    var cred = await navigator.credentials.create({publicKey:{
      challenge: challenge,
      rp: {name:"ZAG GROUP", id: window.location.hostname},
      user: {
        id: new TextEncoder().encode('zaggroup_'+role),
        name: role+'@zaggroup.local',
        displayName: role==='admin'?'Administrateur':'Gestionnaire'
      },
      pubKeyCredParams: [{alg:-7,type:"public-key"},{alg:-257,type:"public-key"}],
      authenticatorSelection: {
        authenticatorAttachment: "platform",
        userVerification: "required",
        residentKey: "preferred"
      },
      timeout: 60000
    }});
    localStorage.setItem('zag_fp_cred_'+role, bufToB64(cred.rawId));
    return true;
  }catch(e){
    if(e.name!=='NotAllowedError') console.error(e);
    return false;
  }
}

async function authenticateFingerprint(role){
  if(!FP_SUPPORTED) return false;
  var credId = localStorage.getItem('zag_fp_cred_'+role);
  if(!credId) return false;
  try{
    var challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({publicKey:{
      challenge: challenge,
      allowCredentials:[{id: b64ToBuf(credId), type:"public-key"}],
      userVerification: "required",
      timeout: 60000
    }});
    return true;
  }catch(e){
    return false;
  }
}

function deleteFingerprint(role){
  try{ localStorage.removeItem('zag_fp_cred_'+role); }catch(e){}
  updateFpButtons();
}

function updateFpButtons(){
  ['gest','admin'].forEach(function(role){
    var btn = document.getElementById('fpBtn_'+role);
    var reg = document.getElementById('fpReg_'+role);
    if(btn){
      var isReg = fpRegistered(role);
      btn.style.display = isReg ? 'flex' : 'none';
    }
    if(reg){
      reg.textContent = fpRegistered(role) ? '🗑️ Supprimer' : '👆 Activer';
      reg.className = fpRegistered(role) ? 'fp-manage-btn fp-del' : 'fp-manage-btn fp-add';
    }
  });
}

async function loginWithFingerprint(role){
  var ok = await authenticateFingerprint(role);
  if(ok){
    resetAttempts(role);
    if(role==='gest'){
      var nom = localStorage.getItem('zag_last_nom')||'Gestionnaire';
      saveSession('gest', nom);
      sessionStorage.setItem('zagNom', nom);
      window.location.href = 'gestionnaire_new-2-7.html';
    } else {
      saveSession('admin','Admin');
      sessionStorage.setItem('zagAdmin','1');
      window.location.href = 'patron-19.html';
    }
  } else {
    showFpError();
  }
}

function showFpError(){
  var el = document.getElementById('fpError');
  if(el){ el.style.display='block'; setTimeout(function(){el.style.display='none';},3000); }
}

// Propose fingerprint activation after PIN success
async function proposerEmpreinte(role){
  if(!FP_SUPPORTED || fpRegistered(role)) return;
  if(!confirm('Voulez-vous activer l\'empreinte digitale pour vous connecter plus rapidement ?')) return;
  var ok = await registerFingerprint(role);
  if(ok){
    alert('✅ Empreinte activée ! Vous pourrez l\'utiliser dès la prochaine connexion.');
    updateFpButtons();
  }
}
