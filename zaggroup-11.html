<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",sans-serif;background:linear-gradient(145deg,#0d2b1a,#1a472a,#2d6a4f);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;position:relative}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo img{height:58px;width:auto;border-radius:10px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.logo-text{}
.logo-name{font-family:"Exo 2",sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:-0.5px;color:#fff}
.logo-sub{font-size:.65rem;color:rgba(255,255,255,.6);margin-top:1px}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot-green{background:#4caf50}.dot-orange{background:#ff9800}.dot-grey{background:#9e9e9e}
.conn-label{font-size:.6rem;color:rgba(255,255,255,.5);margin-bottom:32px;display:flex;align-items:center;justify-content:center;gap:4px}
.btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.btn{padding:16px 20px;border:none;border-radius:18px;font-family:"Exo 2",sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .12s,opacity .2s;text-align:left}
.btn:active{transform:scale(.96)}
.btn-g{background:#fff;color:#1a472a}
.btn-a{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);color:#fff}
.btn-v{background:linear-gradient(135deg,rgba(232,93,4,.85),rgba(232,93,4,.6));border:2px solid rgba(232,93,4,.5);color:#fff}
.btn-icon{font-size:1.5rem;flex-shrink:0;width:36px;text-align:center}
.btn-title{display:block;font-size:.9rem}
.btn-desc{display:block;font-size:.65rem;font-weight:400;opacity:.65;margin-top:2px}
.session-banner{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:14px;padding:12px 16px;margin-bottom:16px;width:100%;max-width:340px;display:none}
.session-banner.show{display:block}
.session-title{font-family:"Exo 2",sans-serif;font-weight:800;font-size:.8rem;margin-bottom:6px}
.session-info{font-size:.72rem;color:rgba(255,255,255,.75);margin-bottom:10px}
.session-btns{display:flex;gap:8px}
.session-btn{flex:1;padding:7px;border:none;border-radius:9px;font-family:"Exo 2",sans-serif;font-size:.72rem;font-weight:700;cursor:pointer}
.session-resume{background:#fff;color:#1a472a}
.session-close{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.pin-screen{position:fixed;inset:0;background:linear-gradient(145deg,#0d2b1a,#1a472a,#2d6a4f);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:100}
.pin-screen.show{display:flex}
.pin-card{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:340px;color:#1a472a}
.pin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.pin-title{font-family:"Exo 2",sans-serif;font-size:1rem;font-weight:800}
.pin-role-badge{font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:20px;background:#e8f5e9;color:#1a472a}
.pin-field{margin-bottom:11px}
.pin-field label{font-size:.72rem;font-weight:600;color:#4a6350;display:block;margin-bottom:4px}
.pin-field input{width:100%;padding:11px 12px;border:2px solid #c8e6c9;border-radius:11px;font-family:"Inter",sans-serif;font-size:1rem;outline:none;transition:border-color .2s}
.pin-field input:focus{border-color:#40916c}
.pin-code{font-size:1.6rem;letter-spacing:10px;text-align:center}
.pin-err{color:#c62828;font-size:.73rem;font-weight:600;min-height:16px;text-align:center;margin-bottom:8px}
.pin-block{background:#fff3e0;border-radius:10px;padding:10px;text-align:center;margin-bottom:10px;display:none}
.pin-block-msg{font-size:.78rem;color:#e65100;font-weight:700}
.pin-block-timer{font-family:"Exo 2",sans-serif;font-size:1.2rem;font-weight:900;color:#e85d04;margin-top:4px}
.pin-submit{width:100%;padding:13px;background:linear-gradient(135deg,#2d6a4f,#40916c);color:#fff;border:none;border-radius:12px;font-family:"Exo 2",sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.pin-submit:disabled{opacity:.5;cursor:not-allowed}
.pin-attempts{font-size:.65rem;color:#888;text-align:center;margin-top:8px;min-height:14px}
.pin-back{background:transparent;border:none;color:rgba(255,255,255,.55);font-size:.82rem;margin-top:14px;cursor:pointer;font-family:"Inter",sans-serif}
.install-banner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a472a,#40916c);color:#fff;padding:12px 16px;display:none;align-items:center;gap:10px;box-shadow:0 -2px 20px rgba(0,0,0,.3);z-index:50}
.install-banner.show{display:flex}
.install-banner p{flex:1;font-size:.78rem;font-weight:600}
.install-btn{background:#fff;color:#1a472a;border:none;border-radius:8px;padding:7px 14px;font-family:"Exo 2",sans-serif;font-size:.75rem;font-weight:700;cursor:pointer}
.install-close{background:transparent;color:rgba(255,255,255,.6);border:none;font-size:1.1rem;cursor:pointer;padding:0 4px}
.footer{position:fixed;bottom:16px;font-size:.6rem;color:rgba(255,255,255,.3);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}


.fp-btn{display:none;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:7px 12px;font-family:"Exo 2",sans-serif;font-size:.72rem;font-weight:700;cursor:pointer;margin-top:8px;width:100%;transition:background .2s}
.fp-btn:hover{background:rgba(255,255,255,.25)}
.fp-btn-gest{border-color:rgba(26,71,42,.4);background:rgba(26,71,42,.15);color:#1a472a}
.fp-error{display:none;background:var(--rl,#ffebee);color:var(--r,#c62828);font-size:.75rem;font-weight:700;padding:7px 12px;border-radius:10px;text-align:center;margin-top:8px}
.fp-manage-btn{padding:7px 16px;border:none;border-radius:10px;font-family:"Exo 2",sans-serif;font-size:.78rem;font-weight:700;cursor:pointer}
.fp-add{background:var(--g,#1a472a);color:#fff}
.fp-del{background:var(--r,#c62828);color:#fff}
.fp-status{font-size:.72rem;color:rgba(255,255,255,.65);margin-top:3px}
</style>
</head>
<body>

  <div class="logo">
    <img src="./ic%C3%B4ne-512.png" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'><rect fill=\'%231a472a\' width=\'64\' height=\'64\' rx=\'10\'/><text x=\'32\' y=\'44\' text-anchor=\'middle\' font-size=\'28\' font-weight=\'bold\' fill=\'%23c9a227\'>Z</text></svg>'" alt="ZAG GROUP">
    <div class="logo-text">
      <div class="logo-name">ZAG GROUP</div>

  </div>
  <div class="conn-label">
    <span class="status-dot dot-grey" id="connDot"></span>

  <!-- SESSION RESUME BANNER -->
  <div class="session-banner" id="sessionBanner">

    <div class="fp-error" id="fpError">&#10060; Empreinte non reconnue. Utilisez votre code PIN.</div>
    <button class="btn btn-v" onclick="window.location.href='vitrine_v3_finale.html'">
      <span class="btn-icon">&#128293;</span>

</div>

<!-- PIN SCREEN -->
<div class="pin-screen" id="pinScreen">
  <div class="logo" style="margin-bottom:20px">
    <img src="./ic%C3%B4ne-512.png" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'><rect fill=\'%231a472a\' width=\'64\' height=\'64\' rx=\'10\'/><text x=\'32\' y=\'44\' text-anchor=\'middle\' font-size=\'28\' font-weight=\'bold\' fill=\'%23c9a227\'>Z</text></svg>'" alt="ZAG GROUP" style="height:44px">
  </div>
  <div class="pin-card">
    <div class="pin-header">
      <div class="pin-title" id="pinTitle">Acc&egrave;s</div>
      <span class="pin-role-badge" id="pinRoleBadge">-</span>
    </div>
    <div class="pin-block" id="pinBlock">
      <div class="pin-block-msg">&#128274; Trop de tentatives &mdash; attendez</div>
      <div class="pin-block-timer" id="pinBlockTimer"></div>
    </div>
    <div class="pin-field" id="nomField">
      <label for="pinNom">Votre pr&eacute;nom</label>

    </div>

<!-- INSTALL BANNER -->
<div class="install-banner" id="installBanner">

  <button class="install-btn" id="installBtn">Installer</button>

</div>

<script>

var FIREBASE_OK=false, db=null;
var CODES={gest:'5678',admin:'1234'};
var SESSION_DURATION=15*60*1000;

// -- Charger codes locaux immédiatement --
try{
  var cl=JSON.parse(localStorage.getItem('zag_codes')||'{}');
  if(cl.gest) CODES.gest=cl.gest;
  if(cl.admin) CODES.admin=cl.admin;
}catch(e){}

// -- Firebase en arrière-plan --
if(navigator.onLine){
  (function(){
    var s1=document.createElement('script');
    s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
    s1.onload=function(){
      var s2=document.createElement('script');
      s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
      s2.onload=function(){
        try{
          if(!firebase.apps.length){
            firebase.initializeApp({
              apiKey:"AIzaSyDWF-Q3S2M-btrRBHBYzd9dVbY6iEg_fNk",
              authDomain:"gestionpieces-74559.firebaseapp.com",
              projectId:"gestionpieces-74559",
              storageBucket:"gestionpieces-74559.firebasestorage.app",
              messagingSenderId:"392970031226",
              appId:"1:392970031226:web:68bb9966b4440576a2ebc3"
            });
          }
          db=firebase.firestore();
          FIREBASE_OK=true;
          setConnStatus(true);
          chargerCodes();
        }catch(e){ setConnStatus(false); }
      };
      s2.onerror=function(){ setConnStatus(false); };
      document.head.appendChild(s2);
    };
    s1.onerror=function(){ setConnStatus(false); };
    document.head.appendChild(s1);
  })();
}else{ setConnStatus(false); }

function setConnStatus(ok){
  var dot=document.getElementById('connDot');
  var lbl=document.getElementById('connLabel');
  if(!dot) return;
  if(ok){ dot.className='status-dot dot-green'; lbl.textContent='Firebase connect\u00e9'; }
  else{ dot.className='status-dot dot-orange'; lbl.textContent='Mode hors-ligne'; }
}

function chargerCodes(){
  if(!db||!FIREBASE_OK) return;
  db.collection('app_config').doc('codes').get().then(function(doc){
    if(doc.exists){
      var d=doc.data();
      if(d.gest) CODES.gest=d.gest;
      if(d.admin) CODES.admin=d.admin;
      try{ localStorage.setItem('zag_codes',JSON.stringify({gest:CODES.gest,admin:CODES.admin})); }catch(e){}
    }
  }).catch(function(){});
}

// -- Rate limiting --
function getAttempts(role){
  try{ return JSON.parse(localStorage.getItem('zag_att_'+role)||'{"n":0,"until":0}'); }
  catch(e){ return {n:0,until:0}; }
}
function saveAttempts(role,data){
  try{ localStorage.setItem('zag_att_'+role,JSON.stringify(data)); }catch(e){}
}
function recordFail(role){
  var a=getAttempts(role);
  a.n=(a.n||0)+1;
  var delays=[0,0,30,60,120,300,600];
  var delay=delays[Math.min(a.n,delays.length-1)];
  a.until=Date.now()+(delay*1000);
  saveAttempts(role,a);
  return a;
}
function resetAttempts(role){
  saveAttempts(role,{n:0,until:0});
}
function isBlocked(role){
  var a=getAttempts(role);
  return Date.now()<a.until;
}
function blockSecondsLeft(role){
  var a=getAttempts(role);
  return Math.max(0,Math.ceil((a.until-Date.now())/1000));
}

// -- Session --
function saveSession(role,nom){
  try{
    var sess={role:role,nom:nom||'',expiry:Date.now()+SESSION_DURATION};
    sessionStorage.setItem('zag_session',JSON.stringify(sess));
  }catch(e){}
}
function getSession(){
  try{
    var sess=JSON.parse(sessionStorage.getItem('zag_session')||'null');
    if(sess&&Date.now()<sess.expiry) return sess;
  }catch(e){}
  return null;
}
function clearSession(){
  try{ sessionStorage.removeItem('zag_session'); }catch(e){}
}

// -- Session resume --
var sess=getSession();
if(sess){
  var sb=document.getElementById('sessionBanner');
  if(sb){
    sb.classList.add('show');
    var role_lbl=sess.role==='admin'?'Administrateur':'Gestionnaire';
    var nomAff=(sess.nom&&isNaN(sess.nom))?(' — '+sess.nom):'';document.getElementById('sessInfo').textContent=role_lbl+nomAff+' (session active)';
  }
}

function resumeSession(){
  var s=getSession();
  if(!s){ clearSessionBanner(); return; }
  saveSession(s.role,s.nom);
  if(s.role==='admin'){
    sessionStorage.setItem('zagAdmin','1');
    window.location.href='patron-19.html';
  }else{
    sessionStorage.setItem('zagNom',s.nom);
    window.location.href='gestionnaire_new-2-7.html';
  }
}
function clearSessionBanner(){
  clearSession();
  var sb=document.getElementById('sessionBanner');
  if(sb) sb.classList.remove('show');
}

// -- PIN Screen --
var currentRole=null;
var blockInterval=null;

function openPin(role){
  currentRole=role;
  var isAdm=role==='admin';
  document.getElementById('pinTitle').textContent=isAdm?'Acc\u00e8s Administrateur':'Acc\u00e8s Gestionnaire';
  document.getElementById('pinRoleBadge').textContent=isAdm?'Admin':'Gestionnaire';
  document.getElementById('nomField').style.display=isAdm?'none':'block';
  document.getElementById('pinCode').value='';
  document.getElementById('pinNom').value='';
  document.getElementById('pinErr').textContent='';
  document.getElementById('pinAttemptsInfo').textContent='';
  document.getElementById('pinBlock').style.display='none';
  // Pre-fill last name for gestionnaire
  if(!isAdm){
    try{
      var lastNom=localStorage.getItem('zag_last_nom')||'';
      document.getElementById('pinNom').value=lastNom;
    }catch(e){}
  }
  // Check if blocked
  if(isBlocked(role)){
    showBlock(role);
  }
  document.getElementById('pinScreen').classList.add('show');
  setTimeout(function(){
    var focus_el=isAdm?document.getElementById('pinCode'):(document.getElementById('pinNom').value?document.getElementById('pinCode'):document.getElementById('pinNom'));
    focus_el.focus();
  },300);
}

function closePin(){
  document.getElementById('pinScreen').classList.remove('show');
  currentRole=null;
  if(blockInterval){ clearInterval(blockInterval); blockInterval=null; }
}

function showBlock(role){
  var blockEl=document.getElementById('pinBlock');
  var timerEl=document.getElementById('pinBlockTimer');
  var submitEl=document.getElementById('pinSubmit');
  blockEl.style.display='block';
  submitEl.disabled=true;
  if(blockInterval) clearInterval(blockInterval);
  blockInterval=setInterval(function(){
    var left=blockSecondsLeft(role);
    if(left<=0){
      clearInterval(blockInterval); blockInterval=null;
      blockEl.style.display='none';
      submitEl.disabled=false;
      timerEl.textContent='';
    }else{
      var m=Math.floor(left/60), s=left%60;
      timerEl.textContent=(m>0?m+'min ':'')+s+'s';
    }
  },500);
}

document.getElementById('pinSubmit').addEventListener('click',function(){
  if(this.disabled) return;
  var code=document.getElementById('pinCode').value.trim();
  var nom=document.getElementById('pinNom').value.trim();
  var errEl=document.getElementById('pinErr');
  var attEl=document.getElementById('pinAttemptsInfo');
  if(!code){errEl.textContent='Entrez votre code PIN.';return;}
  if(currentRole==='gest'&&!nom){errEl.textContent='Entrez votre pr\u00e9nom.';return;}
  if(isBlocked(currentRole)){showBlock(currentRole);return;}
  var expected=currentRole==='admin'?CODES.admin:CODES.gest;
  if(code!==expected){
    var att=recordFail(currentRole);
    document.getElementById('pinCode').value='';
    document.getElementById('pinCode').classList.add('shake');
    setTimeout(function(){document.getElementById('pinCode').classList.remove('shake');},400);
    var left=blockSecondsLeft(currentRole);
    if(left>0){
      errEl.textContent='Code incorrect. Blocage activ\u00e9.';
      showBlock(currentRole);
    }else{
      var remaining=3-((att.n)%3);
      if(remaining<3) attEl.textContent='Attention : encore '+remaining+' essai(s) avant blocage.';
      errEl.textContent='Code incorrect.';
    }
    return;
  }
  // Succès
  resetAttempts(currentRole);
  if(currentRole==='gest'){
    try{ localStorage.setItem('zag_last_nom',nom); }catch(e){}
    var nomFinal=(nom&&isNaN(nom))?nom:'Gestionnaire';saveSession('gest',nomFinal);
    sessionStorage.setItem('zagNom',nomFinal);
    closePin();
    proposerEmpreinte('gest').then(function(){window.location.href='gestionnaire_new-2-7.html';});
  }else{
    saveSession('admin','Admin');
    sessionStorage.setItem('zagAdmin','1');
    closePin();
    proposerEmpreinte('admin').then(function(){window.location.href='patron-19.html';});
  }
});

document.getElementById('pinCode').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('pinSubmit').click();
});
document.getElementById('pinNom').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('pinCode').focus();
});

// -- PWA --
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferredPrompt=e;
  var b=document.getElementById('installBanner');
  var b2=document.getElementById('installBanner2');
  if(b) b.classList.add('show');
  if(b2) b2.style.display='block';
});
function triggerInstall(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){deferredPrompt=null;document.getElementById('installBanner').classList.remove('show');});
  }
}
document.getElementById('installBtn').addEventListener('click', triggerInstall);
(function(){var b2=document.getElementById('installBtn2');if(b2)b2.addEventListener('click',triggerInstall);})();
document.getElementById('installClose').addEventListener('click',function(){
  document.getElementById('installBanner').classList.remove('show');
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    reg.addEventListener('updatefound',function(){
      var nSW=reg.installing;
      if(nSW) nSW.addEventListener('statechange',function(){
        if(nSW.state==='installed'&&navigator.serviceWorker.controller) nSW.postMessage({type:'SKIP_WAITING'});
      });
    });
  }).catch(function(){});
}

// Connection status init
setTimeout(function(){
  if(!FIREBASE_OK) setConnStatus(false);
},3000);
updateFpButtons();


// ===== EMPREINTE DIGITALE (WebAuthn) =====
var FP_SUPPORTED = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);

function bufToB64(buf){
  return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
}
function b64ToBuf(b64){
  var bin=atob(b64);
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr.buffer;
}

function fpRegistered(role){
  try{ return !!localStorage.getItem('zag_fp_cred_'+role); }catch(e){ return false; }
}

async function registerFingerprint(role){
  if(!FP_SUPPORTED){
    var isChrome=navigator.userAgent.indexOf('Chrome')>-1&&navigator.userAgent.indexOf('Edg')===-1;
    if(!isChrome){
      alert('\u26a0\uFE0F Empreinte non disponible.\n\nUtilisez Google Chrome sur Android pour activer cette fonctionnalit\u00e9.');
    } else {
      alert('\u26a0\uFE0F Votre appareil ne supporte pas l\'authentification biom\u00e9trique.');
    }
    return false;
  }
  try{
    var challenge = crypto.getRandomValues(new Uint8Array(32));
    var cred = await navigator.credentials.create({publicKey:{
      challenge: challenge,
      rp: {name:"ZAG GROUP", id: window.location.hostname},
      user: {
        id: new TextEncoder().encode('zaggroup_'+role),
        name: role+'@zaggroup.local',
        displayName: role==='admin'?'Administrateur':'Gestionnaire'
      },
      pubKeyCredParams: [{alg:-7,type:"public-key"},{alg:-257,type:"public-key"}],
      authenticatorSelection: {
        authenticatorAttachment: "platform",
        userVerification: "required",
        residentKey: "preferred"
      },
      timeout: 60000
    }});
    localStorage.setItem('zag_fp_cred_'+role, bufToB64(cred.rawId));
    return true;
  }catch(e){
    if(e.name!=='NotAllowedError') console.error(e);
    return false;
  }
}

async function authenticateFingerprint(role){
  if(!FP_SUPPORTED) return false;
  var credId = localStorage.getItem('zag_fp_cred_'+role);
  if(!credId) return false;
  try{
    var challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({publicKey:{
      challenge: challenge,
      allowCredentials:[{id: b64ToBuf(credId), type:"public-key"}],
      userVerification: "required",
      timeout: 60000
    }});
    return true;
  }catch(e){
    return false;
  }
}

function deleteFingerprint(role){
  try{ localStorage.removeItem('zag_fp_cred_'+role); }catch(e){}
  updateFpButtons();
}

function updateFpButtons(){
  ['gest','admin'].forEach(function(role){
    var btn = document.getElementById('fpBtn_'+role);
    var reg = document.getElementById('fpReg_'+role);
    if(btn){
      var isReg = fpRegistered(role);
      btn.style.display = isReg ? 'flex' : 'none';
    }
    if(reg){
      reg.textContent = fpRegistered(role) ? '🗑️ Supprimer' : '👆 Activer';
      reg.className = fpRegistered(role) ? 'fp-manage-btn fp-del' : 'fp-manage-btn fp-add';
    }
  });
}

async function loginWithFingerprint(role){
  var ok = await authenticateFingerprint(role);
  if(ok){
    resetAttempts(role);
    if(role==='gest'){
      var nom = localStorage.getItem('zag_last_nom')||'Gestionnaire';
      saveSession('gest', nom);
      sessionStorage.setItem('zagNom', nom);
      window.location.href = 'gestionnaire_new-2-7.html';
    } else {
      saveSession('admin','Admin');
      sessionStorage.setItem('zagAdmin','1');
      window.location.href = 'patron-19.html';
    }
  } else {
    showFpError();
  }
}

function showFpError(){
  var el = document.getElementById('fpError');
  if(el){ el.style.display='block'; setTimeout(function(){el.style.display='none';},3000); }
}

// Propose fingerprint activation after PIN success
async function proposerEmpreinte(role){
  if(!FP_SUPPORTED || fpRegistered(role)) return;
  if(!confirm('Voulez-vous activer l\'empreinte digitale pour vous connecter plus rapidement ?')) return;
  var ok = await registerFingerprint(role);
  if(ok){
    alert('✅ Empreinte activée ! Vous pourrez l\'utiliser dès la prochaine connexion.');
    updateFpButtons();
  }
}
