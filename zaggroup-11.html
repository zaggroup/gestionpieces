<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",sans-serif;background:linear-gradient(145deg,#0d2b1a,#1a472a,#2d6a4f);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff}

.logo{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.logo img{height:52px;width:auto;border-radius:8px}
.logo span{font-family:"Exo 2",sans-serif;font-size:2rem;font-weight:900;letter-spacing:-1px}
.sub{font-size:.82rem;color:rgba(255,255,255,.6);margin-bottom:44px;text-align:center}

.btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.btn{padding:18px 20px;border:none;border-radius:18px;font-family:"Exo 2",sans-serif;font-size:1rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn-g{background:#fff;color:#1a472a}
.btn-a{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff}
.btn-icon{font-size:1.6rem;flex-shrink:0}
.btn-text{text-align:left}
.btn-title{display:block;font-size:.95rem}
.btn-desc{display:block;font-size:.68rem;font-weight:400;opacity:.65;margin-top:2px}

/* PIN SCREEN */
.pin-screen{position:fixed;inset:0;background:linear-gradient(145deg,#0d2b1a,#1a472a,#2d6a4f);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:100}
.pin-screen.show{display:flex}
.pin-card{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:340px;color:#1a472a}
.pin-title{font-family:"Exo 2",sans-serif;font-size:1rem;font-weight:800;margin-bottom:16px}
.pin-field{margin-bottom:12px}
.pin-field label{font-size:.72rem;font-weight:600;color:#4a6350;display:block;margin-bottom:4px}
.pin-field input{width:100%;padding:12px;border:2px solid #c8e6c9;border-radius:12px;font-family:"Inter",sans-serif;font-size:1rem;outline:none}
.pin-field input:focus{border-color:#40916c}
.pin-code{font-size:1.4rem;letter-spacing:8px;text-align:center}
.pin-err{color:#c62828;font-size:.75rem;font-weight:600;min-height:18px;text-align:center;margin-bottom:8px}
.pin-submit{width:100%;padding:13px;background:linear-gradient(135deg,#2d6a4f,#40916c);color:#fff;border:none;border-radius:12px;font-family:"Exo 2",sans-serif;font-size:1rem;font-weight:700;cursor:pointer}
.pin-back{background:transparent;border:none;color:rgba(255,255,255,.6);font-size:.82rem;margin-top:16px;cursor:pointer;font-family:"Inter",sans-serif}

/* INSTALL BANNER */
.install-banner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a472a,#40916c);color:#fff;padding:12px 16px;display:none;align-items:center;gap:10px;box-shadow:0 -2px 20px rgba(0,0,0,.3);z-index:50}
.install-banner.show{display:flex}
.install-banner p{flex:1;font-size:.78rem;font-weight:600}
.install-btn{background:#fff;color:#1a472a;border:none;border-radius:8px;padding:7px 14px;font-family:"Exo 2",sans-serif;font-size:.75rem;font-weight:700;cursor:pointer}
.install-close{background:transparent;color:rgba(255,255,255,.6);border:none;font-size:1.1rem;cursor:pointer;padding:0 4px}

.footer{position:fixed;bottom:24px;font-size:.65rem;color:rgba(255,255,255,.35)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
</style>
</head>

    <div class="pin-field" id="nomField">
      <label>Votre pr&#233;nom *</label>
      <input type="text" id="pinNom" placeholder="Ex: Mamadou" autocomplete="off">
    </div>
    <div class="pin-field">
      <label>Code secret *</label>
      <input type="password" id="pinCode" class="pin-code" placeholder="&#9679;&#9679;&#9679;&#9679;" autocomplete="off" inputmode="numeric">
    </div>
    <div class="pin-err" id="pinErr"></div>
    <button class="pin-submit" id="pinSubmit">&#9654; Entrer</button>
  </div>
  <button class="pin-back" onclick="closePin()">&#8592; Changer de r&#244;le</button>
</div>

<!-- INSTALL -->
<div class="install-banner" id="installBanner">
  <p>&#128640; Installer l'app ZAG GROUP sur votre écran d'accueil</p>
  <button class="install-btn" id="installBtn">Installer</button>
  <button class="install-close" id="installClose">&#10005;</button>
</div>

<div class="footer">ZAG GROUP &#169; 2026 &#8212; Propuls&#233; par Firebase</div>

<script>
var currentRole = null;
var CODES = { gest: '5678', admin: '1234' };
var CODES_PRETS = false;

// Charger codes depuis localStorage d'abord (hors-ligne)
try {
  var codesLocaux = JSON.parse(localStorage.getItem('zag_codes') || '{}');
  if(codesLocaux.gest) CODES.gest = codesLocaux.gest;
  if(codesLocaux.admin) CODES.admin = codesLocaux.admin;
  if(codesLocaux.gest || codesLocaux.admin) CODES_PRETS = true;
} catch(e){}

// Charger codes depuis Firebase et mettre à jour localStorage
db.collection('app_config').doc('codes').get().then(function(doc){
  if(doc.exists){
    var d = doc.data();
    if(d.gest) CODES.gest = d.gest;
    if(d.admin) CODES.admin = d.admin;
    try { localStorage.setItem('zag_codes', JSON.stringify({gest:CODES.gest, admin:CODES.admin})); } catch(e){}
  }
  CODES_PRETS = true;
}).catch(function(){
  // Firebase inaccessible - utiliser codes locaux
  CODES_PRETS = true;
});

function openPin(role){
  currentRole = role;
  var isAdmin = role === 'admin';
  document.getElementById('pinRole').textContent = isAdmin ? 'Administrateur' : 'Gestionnaire';
  document.getElementById('pinTitle').textContent = isAdmin ? 'Acc\u00e8s Administrateur' : 'Acc\u00e8s Gestionnaire';
  document.getElementById('nomField').style.display = isAdmin ? 'none' : '';
  document.getElementById('pinCode').value = '';
  document.getElementById('pinNom').value = '';
  document.getElementById('pinErr').textContent = '';
  document.getElementById('pinScreen').classList.add('show');
  setTimeout(function(){
    (isAdmin ? document.getElementById('pinCode') : document.getElementById('pinNom')).focus();
  }, 300);
}

function closePin(){
  document.getElementById('pinScreen').classList.remove('show');
  currentRole = null;
}

document.getElementById('pinSubmit').addEventListener('click', function(){
  if(this.dataset.busy) return;
  this.dataset.busy = '1';
  var self = this;
  setTimeout(function(){ delete self.dataset.busy; }, 2000);
  var code = document.getElementById('pinCode').value;
  var nom = document.getElementById('pinNom').value.trim();
  var errEl = document.getElementById('pinErr');

  if(!code){ errEl.textContent = 'Entrez votre code.'; return; }
  if(currentRole === 'gest' && !nom){ errEl.textContent = 'Entrez votre prenom.'; return; }

  if(!CODES_PRETS){
    errEl.textContent = 'Chargement en cours, réessayez...';
    setTimeout(function(){ errEl.textContent = ''; }, 1500);
    if(document.getElementById('pinSubmit').dataset) delete document.getElementById('pinSubmit').dataset.busy;
    return;
  }
  var expected = currentRole === 'admin' ? CODES.admin : CODES.gest;
  if(code !== expected){
    errEl.textContent = 'Code incorrect.';
    document.getElementById('pinCode').value = '';
    document.getElementById('pinCode').classList.add('shake');
    setTimeout(function(){
      errEl.textContent = '';
      document.getElementById('pinCode').classList.remove('shake');
    }, 1500);
    return;
  }

  // Rediriger vers la bonne interface
  if(currentRole === 'gest'){
    // Sauvegarder le nom pour le gestionnaire
    try { sessionStorage.setItem('zagNom', nom); } catch(e){}
    window.location.href = 'gestionnaire_new-2-7.html';
  } else {
    try { sessionStorage.setItem('zagAdmin','1'); } catch(e){}
    window.location.href = 'patron-19.html';
  }
});

document.getElementById('pinCode').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('pinSubmit').click();
});
document.getElementById('pinNom').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('pinCode').focus();
});

// PWA Installation
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; document.getElementById('installBanner').classList.remove('show'); });
  }
});
document.getElementById('installClose').addEventListener('click', function(){
  document.getElementById('installBanner').classList.remove('show');
});

// Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
