// Switch mode entrée
function switchModeEntree(isNew){
  modeNouveauProd = isNew;
  var btnE = document.getElementById('btnProdExist');
  var btnN = document.getElementById('btnProdNew');
  var sectE = document.getElementById('sectExist');
  var sectN = document.getElementById('sectNew');
  if(isNew){
    btnN.style.background = 'linear-gradient(135deg,var(--g2),var(--g3))';
    btnN.style.color = '#fff';
    btnN.style.border = 'none';
    btnE.style.background = '#fff';
    btnE.style.color = 'var(--g)';
    btnE.style.border = '2px solid var(--g3)';
    sectE.style.display = 'none';
    sectN.style.display = '';
  } else {
    btnE.style.background = 'linear-gradient(135deg,var(--g2),var(--g3))';
    btnE.style.color = '#fff';
    btnE.style.border = 'none';
    btnN.style.background = '#fff';
    btnN.style.color = 'var(--g)';
    btnN.style.border = '2px solid var(--g3)';
    sectE.style.display = '';
    sectN.style.display = 'none';
  }
} // Code d'accès gestionnaire - à changer

// Auto-connexion si nom déjà saisi dans zaggroup-11.html
function demarrer(){
  (function(){
  var nomSession = '';
  try { nomSession = sessionStorage.getItem('zagNom') || ''; } catch(e){}
  if(nomSession){
    SESSION.nom = nomSession;
    SESSION.code = GEST_CODE;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('sessionInfo').textContent = '👤 ' + nomSession;
    if(FIREBASE_OK) db.collection('sessions').add({
      gestionnaire: nomSession,
      action: 'connexion',
      date: firebase.firestore.Timestamp.now()
    }).catch(function(){});
    lancerDonnees();
    // Heartbeat : rafraîchir la session toutes les 30 min + vérifier expiry
    (function startHeartbeat(){
      setInterval(function(){
        try{
          var sess = JSON.parse(sessionStorage.getItem('zag_session')||'null');
          if(!sess || Date.now() >= sess.expiry){
            showToast('⏱️ Session expirée — reconnexion requise', true);
            setTimeout(function(){ window.location.href='zaggroup-11.html'; }, 2500);
            return;
          }
          // Renouveler l'expiry (session active = prolongée)
          sess.expiry = Date.now() + 8*60*60*1000;
          sessionStorage.setItem('zag_session', JSON.stringify(sess));
        }catch(e){}
      }, 30*60*1000); // vérifier toutes les 30 minutes
    })();
    return;
  }
  // Sinon afficher l'écran de connexion normalement
  document.getElementById('loginBtn').addEventListener('click', function(){
    var nom = document.getElementById('loginNom').value.trim();
    var code = document.getElementById('loginCode').value.trim();
    var errEl = document.getElementById('loginErr');
    if(!nom){ errEl.textContent = 'Entrez votre prénom.'; return; }
    if(!code){ errEl.textContent = 'Entrez le code d accès.'; return; }
    if(code !== GEST_CODE){
      errEl.textContent = 'Code incorrect. Réessayez.';
      document.getElementById('loginCode').value = '';
      setTimeout(function(){ errEl.textContent = ''; }, 1500);
      return;
    }
    SESSION.nom = nom;
    SESSION.code = code;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('sessionInfo').textContent = '👤 ' + nom;
    if(FIREBASE_OK) db.collection('sessions').add({
      gestionnaire: nom,
      action: 'connexion',
      date: firebase.firestore.Timestamp.now()
    }).catch(function(){});
    lancerDonnees();
    // Heartbeat session
    setInterval(function(){
      try{
        var sess=JSON.parse(sessionStorage.getItem('zag_session')||'null');
        if(!sess||Date.now()>=sess.expiry){
          showToast('⏱️ Session expirée', true);
          setTimeout(function(){window.location.href='zaggroup-11.html';},2500);
        } else {
          sess.expiry=Date.now()+8*60*60*1000;
          sessionStorage.setItem('zag_session',JSON.stringify(sess));
        }
      }catch(e){}
    }, 30*60*1000);
  });
  document.getElementById('loginNom').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
  })();
}

// ===== PHOTO =====
function handlePhoto(input){
  var file = input.files[0]; if(!file) return;
  document.getElementById('pPhotoLoading').style.display = 'block';
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  var img = new Image();
  var reader = new FileReader();
  reader.onload = function(e){
    img.onload = function(){
      var max = 400, w = img.width, h = img.height;
      if(w>h){ if(w>max){h=h*(max/w);w=max;} } else { if(h>max){w=w*(max/h);h=max;} }
      canvas.width=Math.round(w); canvas.height=Math.round(h);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      photoBase64 = canvas.toDataURL('image/jpeg',0.7);
      var prev = document.getElementById('pPhotoPreview');
      prev.src = photoBase64; prev.classList.add('visible');
      document.getElementById('pPhotoPlaceholder').style.display = 'none';
      document.getElementById('pPhotoLoading').style.display = 'none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function resetPhoto(){
  photoBase64 = '';
  var prev = document.getElementById('pPhotoPreview');
  prev.src=''; prev.classList.remove('visible');
  document.getElementById('pPhotoPlaceholder').style.display = '';
  document.getElementById('pPhotoFile').value = '';
  document.getElementById('pPhotoCamera').value = '';
}

// ===== ENTRÉE TOTAL =====
function calcEntreeTotal(){
  var q = parseInt(document.getElementById('eQ').value)||0;
  var p = parseFloat(document.getElementById('eX').value)||0;
  var el = document.getElementById('eTotal');
  if(q>0&&p>0){ document.getElementById('eTotalV').textContent=fmt(q*p)+' FG'; el.classList.add('show'); }
  else el.classList.remove('show');
}
document.getElementById('eQ').addEventListener('input', calcEntreeTotal);
document.getElementById('eX').addEventListener('input', calcEntreeTotal);

// ===== VENTE RECHERCHE =====
document.getElementById('vSrch').addEventListener('input', function(){
  var s = this.value.toLowerCase().trim();
  var res = document.getElementById('vResults');
  if(!s){ res.innerHTML=''; return; }
  var f = prods.filter(function(p){ return p.nom&&p.nom.toLowerCase().indexOf(s)>=0; });
  if(!f.length){ res.innerHTML='<div style="text-align:center;padding:10px;color:var(--tx2);font-size:.8rem">Aucun résultat</div>'; return; }
  res.innerHTML = f.map(function(p){
    var c = p.stock<=0?'var(--r)':p.stock<=(p.stockMin||5)?'var(--y)':'var(--g)';
    return '<div class="vrow" data-id="'+p.id+'" data-pv="'+(p.prixVente||0)+'" data-pa="'+(p.prixAchat||0)+'" data-sk="'+(p.stock||0)+'" data-nm="'+p.nom.replace(/"/g,'&quot;')+'" data-ct="'+(p.categorie||'')+'">'
      +'<div class="vrow-name">'+p.nom+'</div>'
      +'<div class="vrow-meta">'+p.categorie+' • Prix: <b>'+fmt(p.prixVente)+' FG</b> • <span style="color:'+c+'">Stock: '+p.stock+'</span></div>'
      +'</div>';
  }).join('');
  document.querySelectorAll('.vrow').forEach(function(r){
    r.addEventListener('click', function(){
      document.getElementById('vId').value = this.dataset.id;
      document.getElementById('vPxAchat').value = this.dataset.pa;
      document.getElementById('vPx').value = this.dataset.pv;
      document.getElementById('vSelName').textContent = this.dataset.nm;
      document.getElementById('vSelMeta').textContent = this.dataset.ct+' • Stock dispo: '+this.dataset.sk+' • Prix: '+fmt(this.dataset.pv)+' FG';
      document.getElementById('vSelBox').style.display = 'block';
      document.getElementById('vResults').innerHTML = '';
      document.getElementById('vSrch').value = this.dataset.nm;
      calcVenteTotal();
    });
  });
});

  var el = document.getElementById('vTotal');
  if(q>0&&p>0){ document.getElementById('vTotalV').textContent=fmt(q*p)+' FG'; el.classList.add('show'); }
  else el.classList.remove('show');
}
document.getElementById('vQt').addEventListener('input', calcVenteTotal);
document.getElementById('vPx').addEventListener('input', calcVenteTotal);

// ===== CATÉGORIES =====
document.getElementById('cats').addEventListener('click', function(e){
  var b = e.target.closest('.pbtn'); if(!b) return;
  document.querySelectorAll('#cats .pbtn').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active'); catF = b.getAttribute('data-c')||'';
  renderProduits();

// ===== RENDER PRODUITS =====
function renderProduits(){
  var el = document.getElementById('lstP');
  var s = document.getElementById('srch').value.toLowerCase();
  var f = prods.filter(function(p){
    return (!s||(p.nom&&p.nom.toLowerCase().indexOf(s)>=0)||(p.categorie&&p.categorie.toLowerCase().indexOf(s)>=0))
      && (!catF||p.categorie===catF);
  });
  document.getElementById('prodCount').textContent = (s||catF) ? f.length+' résultat(s) sur '+prods.length : prods.length+' produit(s) au catalogue';
  if(!prods.length){ el.innerHTML='<div class="empty"><div class="empty-icon">🔧</div><p>Ajoutez votre premier produit</p></div>'; return; }
  if(!f.length){ el.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>Aucun résultat</p></div>'; return; }
  el.innerHTML = f.map(function(p){
    var sc = p.stock<=0?'sout':p.stock<=(p.stockMin||5)?'slw':'sok';
    var sl = p.stock<=0?'🔴 Rupture':p.stock<=(p.stockMin||5)?'🟡 Faible':'🟢 OK';
    var ph = p.photo ? '<img class="pi-photo" src="'+p.photo+'" alt="'+p.nom+'">' : '<div class="pi-ph">🔧</div>';
    return '<div class="pi">'+ph+'<div class="pi-info">'
      +'<div class="pi-name">'+p.nom+'</div>'
      +'<div class="pi-meta">'+p.categorie+' • '+'⭐'.repeat(p.qualite||1)+'</div>'
      +'<div class="pi-meta">Vente: <b>'+fmt(p.prixVente)+' FG</b> • Stock: '+p.stock+' unités</div>'
      +'</div><span class="stb '+sc+'">'+sl+'</span></div>';
  }).join('');
}

// ===== RENDER ENTRÉES =====
function renderEntrees(){
  var el = document.getElementById('lstE');
  if(!entrees.length){ el.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>Aucune entrée</p></div>'; return; }
  var sorted = [].concat(entrees).sort(function(a,b){ return (b.date?b.date.seconds:0)-(a.date?a.date.seconds:0); });
  el.innerHTML = sorted.map(function(e){
    return '<div class="hi">'
      +'<div class="hi-top"><span class="hi-name">📦 '+e.produitNom+'</span><span class="hi-amount plus">+'+e.quantite+' unités</span></div>'
      +'<div class="hi-meta">'+fmtDate(e.date)+' • '+(e.fournisseur||'—')+' • '+(e.notes||'')+'</div>'
      +'<div class="hi-meta" style="margin-top:2px">Par: '+e.gestionnaire+' • Réf: '+e.recu+'</div>'
      +'</div>';
  }).join('');
}

// ===== RENDER VENTES =====
function renderVentes(){
  var el = document.getElementById('lstV');
  if(!sorties.length){ el.innerHTML='<div class="empty"><div class="empty-icon">💰</div><p>Aucune vente</p></div>'; return; }
  var sorted = [].concat(sorties).sort(function(a,b){ return (b.date?b.date.seconds:0)-(a.date?a.date.seconds:0); });
  el.innerHTML = sorted.map(function(s){
    return '<div class="hi vente">'
      +'<div class="hi-top"><span class="hi-name">🛒 '+s.produitNom+'</span><span class="hi-amount plus">'+fmt(s.montantTotal)+' FG</span></div>'
      +'<div class="hi-meta" style="margin-top:2px;display:flex;justify-content:space-between;align-items:center">'
      +'<span>'+fmtDate(s.date)+' | '+s.gestionnaire+' | Réf: '+s.recu+'</span>'
      +'<button class="signal-btn" onclick="signalerVente(\''+s.recu+'\')">🚨 Erreur</button>'
      +'</div>'
      +'</div>';
  }).join('');
}

function signalerVente(recu){
  document.getElementById('sigRecu').value = recu;
  openOv('ovSignal');
}

// ===== RENDER ACCUEIL =====
function renderAccueil(){
  var rup = prods.filter(function(p){ return p.stock<=0; }).length;
  var todVentes = sorties.filter(function(s){ return s.date&&s.date.toDate&&s.date.toDate().toDateString()===today(); });
  document.getElementById('s1').textContent = prods.length;
  document.getElementById('s2').textContent = todVentes.length;
  document.getElementById('s3').textContent = rup;

  var all = [].concat(
    sorties.map(function(s){ return {type:'v',nom:s.produitNom,val:s.montantTotal,qt:s.quantite,d:s.date}; }),
    entrees.map(function(e){ return {type:'e',nom:e.produitNom,val:e.montantTotal,qt:e.quantite,d:e.date}; })
  ).sort(function(a,b){ return (b.d?b.d.seconds:0)-(a.d?a.d.seconds:0); }).slice(0,5);

  document.getElementById('recents').innerHTML = all.length ? all.map(function(t){
    return '<div class="hi '+(t.type==="v"?'vente':'')+'">'
      +'<div class="hi-top"><span class="hi-name">'+(t.type==="v"?'🛒':'📦')+' '+t.nom+'</span>'
      +'<span class="hi-amount plus">'+( t.type==="v" ? 'Qté: '+t.qt : '+'+fmt(t.val)+' FG')+'</span></div>'
      +'<div class="hi-meta">'+fmtDate(t.d)+' • Qté: '+t.qt+'</div>'
      +'</div>';
  }).join('') : '<div class="empty"><div class="empty-icon">📋</div><p>Aucune action récente</p></div>';

  // FEATURE: indicateur dernière opération
  var toutesOps = [].concat(
    sorties.map(function(s){ return {d:s.date, type:'vente', nom:s.produitNom, par:s.gestionnaire}; }),
    entrees.map(function(e){ return {d:e.date, type:'entree', nom:e.produitNom, par:e.gestionnaire}; }),
    mouvements.map(function(m){ return {d:m.date, type:m.type, nom:m.motif||m.notes||'', par:m.gestionnaire}; })
  ).filter(function(x){ return x.d&&x.d.seconds; })
   .sort(function(a,b){ return b.d.seconds - a.d.seconds; });

  var lastOpEl = document.getElementById('lastOpBanner');
  if(lastOpEl){
    if(toutesOps.length){
      var lo = toutesOps[0];
      var loDate = lo.d.toDate ? lo.d.toDate() : new Date(lo.d.seconds*1000);
      var now = new Date();
      var diffMs = now - loDate;
      var diffMin = Math.floor(diffMs/60000);
      var diffH = Math.floor(diffMs/3600000);
      var diffJ = Math.floor(diffMs/86400000);
      var quand = diffJ>0 ? 'Il y a '+diffJ+' jour'+(diffJ>1?'s':'')
                : diffH>0 ? 'Il y a '+diffH+'h'
                : diffMin>0 ? 'Il y a '+diffMin+' min'
                : "À l'instant";
      var typeLabel = {
        'vente':'🛒 Vente','entree':'📦 Entrée stock',
        'depense':'➖ Dépense','solde_init':'🔄 Solde initial',
        'om_depot':'📲 Dépôt OM','om_retrait':'📲 Retrait OM',
        'encaissement_credit':'💳 Encaissement crédit',
        'vente_offline_sync':'🔄 Sync vente hors-ligne'
      }[lo.type] || ('📋 '+lo.type);
      var loJour = loDate.toDateString()===today() ? "Aujourd'hui"
                 : loDate.toDateString()===(new Date(Date.now()-86400000)).toDateString() ? 'Hier'
                 : loDate.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'});
      lastOpEl.innerHTML =
        '<span style="font-weight:700;color:var(--g)">Dernière op. : '+loJour+'</span>'
        +' &mdash; '+typeLabel+(lo.nom?' · '+lo.nom:'')
        +'<br><span style="color:var(--tx2);font-size:.68rem">'+quand
        +(lo.par?' · par '+lo.par:'')+'</span>';
      // Alerte si pas d'opération depuis plus de 24h
      if(diffJ>=1){
        lastOpEl.style.background='#fff3cd';
        lastOpEl.style.borderColor='#ffc107';
        lastOpEl.style.color='#856404';
      } else {
        lastOpEl.style.background='#e8f5e9';
        lastOpEl.style.borderColor='#4caf50';
        lastOpEl.style.color='#1a472a';
      }
    } else {
      lastOpEl.innerHTML = '📋 Aucune opération enregistrée';
      lastOpEl.style.background='#f5f5f5';
      lastOpEl.style.borderColor='#ccc';
      lastOpEl.style.color='#888';
    }
  }

  var alerte = prods.filter(function(p){ return p.stock<=(p.stockMin||5); });
  document.getElementById('alertes').innerHTML = alerte.length ? alerte.map(function(p){
    return '<div class="pi"><div class="pi-ph">🔧</div><div class="pi-info"><div class="pi-name">'+p.nom+'</div><div class="pi-meta">Stock: '+p.stock+' / min: '+(p.stockMin||5)+'</div></div>'
      +'<span class="stb '+(p.stock<=0?'sout':'slw')+'">'+(p.stock<=0?'🔴 RUPTURE':'🟡 FAIBLE')+'</span></div>';
  }).join('') : '<div class="empty"><div class="empty-icon">✅</div><p>Tous les stocks sont OK</p></div>';
}

// ===== RENDER CAISSE =====
function renderCaisse(){
  var todMouvs = mouvements.filter(function(m){ return m.date&&m.date.toDate&&m.date.toDate().toDateString()===today(); });

  // Calcul espèces
  var soldeInitM = todMouvs.filter(function(m){ return m.type==='solde_init'; });
  var soldeInit = soldeInitM.length ? soldeInitM[soldeInitM.length-1].montant : 0;
  var todVentes = sorties.filter(function(s){ return s.date&&s.date.toDate&&s.date.toDate().toDateString()===today(); });
  // BUG FIX: exclure ventes à crédit (acompte=0) du solde espèces immédiat
  var totalVentes = todVentes.reduce(function(a,s){
    // Si c'est une vente crédit sans acompte, elle ne génère pas de cash immédiat
    return a + (s.montantTotal||0);
  }, 0);
  var todDepenses = todMouvs.filter(function(m){ return m.type==='depense'; });
  var totalDepenses = todDepenses.reduce(function(a,m){ return a+m.montant; }, 0);
  // Encaissements réels (crédits et dépôts clients seulement)
  // Note: vente_offline_sync est EXCLU ici car les ventes sont déjà dans
  // totalVentes (collection sorties). Les compter en double fausserait le solde.
  var totalEncaiss = todMouvs.filter(function(m){
    return m.type==='encaissement_credit'||m.type==='encaissement_depot';
  }).reduce(function(a,m){ return a+m.montant; }, 0);
  var soldeTheoriqueEsp = soldeInit + totalVentes + totalEncaiss - totalDepenses;
  // Note: le solde especes est volontairement masque pour le gestionnaire
  // (carte "Solde Espèces" affiche des points, visible admin uniquement) -
  // aucun element a mettre a jour ici par design.

  // Calcul Orange Money (ancre sur le dernier reset 'om_init' si present, comme cote admin)
  var omInit = mouvements.filter(function(m){ return m.type==='om_init'; });
  var soldeOM = 0, startSec = 0;
  if(omInit.length){
    var lastInit = omInit.sort(function(a,b){return (a.date?a.date.seconds:0)-(b.date?b.date.seconds:0);})[omInit.length-1];
    soldeOM = lastInit.montant;
    startSec = lastInit.date ? lastInit.date.seconds : 0;
  }
  mouvements.filter(function(m){ return m.type!=='om_init' && (m.date?m.date.seconds:0)>=startSec; }).forEach(function(m){
    if(m.type==='om_depot') soldeOM += m.montant;
    if(m.type==='om_retrait') soldeOM -= m.montant;
    if(m.type==='om_achat') soldeOM -= m.montant;
    if(m.type==='om_transfert') soldeOM -= m.montant;
  });
  document.getElementById('soldeOM').textContent = fmt(soldeOM) + ' FG';
  document.getElementById('soldeOMSub').textContent = 'Solde cumulé · Mis à jour en temps réel';

  // Historique mouvements
  var el = document.getElementById('lstCaisse');
  var sorted = [].concat(mouvements).sort(function(a,b){ return (b.date?b.date.seconds:0)-(a.date?a.date.seconds:0); }).slice(0,20);
  if(!sorted.length){ el.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>Aucun mouvement</p></div>'; return; }
  var labels = {
    'solde_init':'🔄 Solde initial','depense':'➖ Dépense','om_depot':'➕ Dépôt OM',
    'om_retrait':'➖ Retrait OM','om_achat':'🛍️ Achat OM','om_transfert':'🔁 Transfert OM',
    'encaissement_credit':'💳 Encaissement crédit','encaissement_depot':'📦 Dépôt client',
    'declaration_montant':'💵 Déclaration caisse','vente_offline_sync':'🔄 Vente hors-ligne'
  };
  var classes = {
    'solde_init':'','depense':'depense','om_depot':'om-depot',
    'om_retrait':'om-retrait','om_achat':'om-achat','om_transfert':'om-transfert',
    'encaissement_credit':'','encaissement_depot':'','vente_offline_sync':''
  };
  var signs = {
    'solde_init':'+','depense':'-','om_depot':'+','om_retrait':'-','om_achat':'-','om_transfert':'-',
    'encaissement_credit':'+','encaissement_depot':'+','declaration_montant':'','vente_offline_sync':'+'
  };
  el.innerHTML = sorted.map(function(m){
    var s = signs[m.type]||'';
    var cls = s==='+' ? 'plus' : 'minus';
    return '<div class="hi '+(classes[m.type]||'')+'">'
      +'<div class="hi-top"><span class="hi-name">'+(labels[m.type]||m.type)+'</span>'
      +'<span class="hi-amount '+cls+'">'+s+fmt(m.montant)+' FG</span></div>'
      +'<div class="hi-meta">'+fmtDate(m.date)+' • '+(m.motif||m.notes||m.ref||'—')+'</div>'
      +'<div class="hi-meta">Par: '+(m.gestionnaire||'—')+'</div>'
      +'</div>';
  }).join('');
}

    }).then(function(ref){
      newProdRef = ref;
      return db.collection('entrees').add({
        produitId: ref.id, produitNom: nomNew,
        fournisseur: fourn, quantite: q, prixUnitaire: px, montantTotal: q*px,
        notes: notes, recu: recu, gestionnaire: SESSION.nom,
        date: firebase.firestore.Timestamp.now()
      });
    }).then(function(){
      return db.collection('signalements').add({
        type: 'nouveau_produit',
        description: 'Nouveau produit: '+nomNew+' - Prix vente suggere: '+Math.round(pvSugg).toLocaleString('fr-FR')+' FG - A valider',
        gestionnaire: SESSION.nom, statut: 'en attente',
        recu: recu, date: firebase.firestore.Timestamp.now()
      });

      closeOv('ovE');
      resetEntreeForm();
      ['eNomNew','ePvNew'].forEach(function(id){ document.getElementById(id).value=''; });
      showToast('Nouveau produit enregistre ! Ref: '+recu);
      btn.disabled=false; btn.textContent='Enregistrer';
    }).catch(function(e){ showToast(e.message, true); btn.disabled=false; btn.textContent='Enregistrer'; });

  } else {
    var pid = document.getElementById('eP').value;
    if(!pid){ showToast('Choisissez un produit', true); btn.disabled=false; btn.textContent='Enregistrer'; return; }
    var p = prods.find(function(x){ return x.id===pid; });
    var prodNom = p ? p.nom : '';
    var stockMin = p ? (p.stockMin||5) : 5;
    var newStock = (p ? p.stock : 0) + q;
    var entreeData = {
      produitId: pid, produitNom: prodNom,
      fournisseur: fourn, quantite: q, prixUnitaire: px, montantTotal: q*px,
      notes: notes, recu: recu, gestionnaire: SESSION.nom,
      date: firebase.firestore.Timestamp.now()
    };

    function entreeAfterSave(offline){
      closeOv('ovE');
      resetEntreeForm();
      btn.disabled=false; btn.textContent='Enregistrer';
      if(offline){
        var pi=prods.findIndex(function(x){return x.id===pid;});
        if(pi>-1){
          prods[pi].stock=(prods[pi].stock||0)+q;
          prods[pi].prixAchat=px;
          try{ localStorage.setItem('zag_prods', JSON.stringify(prods)); }catch(e){}
        }
        renderProduits(); renderAccueil();
        showToast('💾 Entrée sauvegardée — sync auto à la reconnexion');
        updateSyncBanner();
      } else {
        showToast('Entree enregistree ! Ref: '+recu);
        if(newStock <= stockMin){ checkAlerteWhatsApp(prodNom, newStock, stockMin); }
      }
    }

    if(!FIREBASE_OK || !navigator.onLine){
      var el_loc=[];try{el_loc=JSON.parse(localStorage.getItem('zag_entrees_pending')||'[]');}catch(e){}
      entreeData._localId='loc_'+Date.now(); entreeData._synced=false;
      el_loc.unshift(entreeData);
      try{localStorage.setItem('zag_entrees_pending', JSON.stringify(el_loc));}catch(e){}
      entreeAfterSave(true);
      return;
    }

    db.collection('entrees').add(entreeData).then(function(){
      return db.collection('produits').doc(pid).update({
        stock: firebase.firestore.FieldValue.increment(q), prixAchat: px
      });
    }).then(function(){
      entreeAfterSave(false);
    }).catch(function(e){
      var el2=[];try{el2=JSON.parse(localStorage.getItem('zag_entrees_pending')||'[]');}catch(ex){}
      entreeData._localId='loc_'+Date.now(); entreeData._synced=false;
      el2.unshift(entreeData);
      try{localStorage.setItem('zag_entrees_pending', JSON.stringify(el2));}catch(ex){}
      entreeAfterSave(true);
    });
  }
});

// VENTE
document.getElementById('btnSV').addEventListener('click', function(){
  var pid = document.getElementById('vId').value;
  var q = parseInt(document.getElementById('vQt').value)||0;
  var px = parseFloat(document.getElementById('vPx').value)||0;
  if(!pid){ showToast('⚠️ Sélectionnez un produit', true); return; }
  if(!q||!px){ showToast('⚠️ Quantité et prix obligatoires', true); return; }
  var p = prods.find(function(x){ return x.id===pid; });
  if(p&&p.stock<q){ showToast('⚠️ Stock insuffisant: '+p.stock+' unités', true); return; }
  // Avertir si hors-ligne ET cache potentiellement périmé (autre gestionnaire peut avoir vendu)
  if(!navigator.onLine || !FIREBASE_OK){
    var _cts = parseInt(localStorage.getItem('zag_cache_ts')||'0');
    if(_cts > 0 && (Date.now()-_cts) > 2*60*1000){
      if(!confirm('⚠️ Vous êtes hors-ligne et les données ont plus de 2 min.\nUn autre gestionnaire a peut-être vendu ce produit.\nConfirmer quand même la vente de '+q+' x '+p.nom+' ?'))return;
    }
  }
  var recu = genRecu();
  var btn = this; btn.disabled=true; btn.textContent='\u23F3...';
  var venteData = {
    produitId: pid, produitNom: p?p.nom:'',
    quantite: q, prixVente: px, montantTotal: q*px,
    coutAchat: p?(p.prixAchat||0)*q:0,
    recu: recu, gestionnaire: SESSION.nom,
    date: firebase.firestore.Timestamp.now(),
    _originalDate: Date.now()
  };

  // Mise \u00e0 jour stock LOCAL imm\u00e9diate (online ET offline)
  function updateStockLocal(){
    var pi = prods.findIndex(function(x){ return x.id===pid; });
    if(pi>-1){
      prods[pi].stock = Math.max(0, (prods[pi].stock||0) - q);
      try{ localStorage.setItem('zag_prods', JSON.stringify(prods)); }catch(e){}
    }
    renderVentes(); renderAccueil(); renderProduits();
  }

  function afterSave(offline){
    closeOv('ovV');
    document.getElementById('vSrch').value='';
    document.getElementById('vSelBox').style.display='none';
    document.getElementById('vResults').innerHTML='';
    document.getElementById('vTotal').classList.remove('show');
    ['vQt'].forEach(function(id){ document.getElementById(id).value='1'; });
    ['vId','vPxAchat','vPx'].forEach(function(id){ document.getElementById(id).value=''; });
    btn.disabled=false; btn.textContent='\u2705 Enregistrer la vente';
    if(offline){
      updateStockLocal();
      showToast('\uD83D\uDCBE Vente sauvegard\u00e9e \u2014 sync auto \u00e0 la reconnexion');
      updateSyncBanner();
    } else {
      showToast('\u2705 Vente enregistr\u00e9e ! R\u00e9f: '+recu);
    }
  }

  // S\u00e9curit\u00e9 : d\u00e9bloquer apr\u00e8s 8s max
  var guard = setTimeout(function(){
    btn.disabled=false; btn.textContent='\u2705 Enregistrer la vente';
  }, 8000);

  if(!FIREBASE_OK || !navigator.onLine){
    clearTimeout(guard);
    // Sauvegarder dans localStorage
    var sorties_loc = [];
    try{ sorties_loc = JSON.parse(localStorage.getItem('zag_sorties_pending')||'[]'); }catch(e){}
    venteData._localId = 'loc_'+Date.now();
    venteData._synced = false;
    sorties_loc.unshift(venteData);
    try{ localStorage.setItem('zag_sorties_pending', JSON.stringify(sorties_loc)); }catch(e){}
    afterSave(true);
    return;
  }

  var prodRef = db.collection('produits').doc(pid);
  db.runTransaction(function(transaction){
    return transaction.get(prodRef).then(function(doc){
      var stockReel = doc.exists ? (doc.data().stock||0) : 0;
      if(stockReel < q){
        throw new Error('Stock insuffisant (reel: '+stockReel+', demande: '+q+')');
      }
      transaction.update(prodRef, {stock: stockReel - q});
    });
  }).then(function(){
    return db.collection('sorties').add(venteData);
  }).then(function(){
    clearTimeout(guard);
    afterSave(false);
  }).catch(function(e){
    clearTimeout(guard);
    if(e.message && e.message.indexOf('Stock insuffisant')>-1){
      // Vrai conflit de stock (vente concurrente) - NE PAS mettre en file offline
      showToast('\u26a0\ufe0f '+e.message+' - rafraichissez et reessayez', true);
      btn.disabled=false; btn.textContent='\u2705 Enregistrer la vente';
      return;
    }
    // Erreur reseau/autre -> fallback offline
    var sl=[];try{sl=JSON.parse(localStorage.getItem('zag_sorties_pending')||'[]');}catch(ex){}
    venteData._localId='loc_'+Date.now();venteData._synced=false;
    sl.unshift(venteData);
    try{localStorage.setItem('zag_sorties_pending',JSON.stringify(sl));}catch(ex){}
    afterSave(true);
  });
});

function checkAlerteWhatsApp(prodNom, newStock, stockMin){
  if(newStock <= 0){

// ===== CLOTURE JOURNALIERE =====
function ouvrirCloture(){
  var todStr = new Date().toDateString();
  var todVentes = sorties.filter(function(s){ return s.date&&s.date.toDate&&s.date.toDate().toDateString()===todStr; });
  var todMouvs = mouvements.filter(function(m){ return m.date&&m.date.toDate&&m.date.toDate().toDateString()===todStr; });
  var nbVentes = todVentes.length;
  var totalVentes = todVentes.reduce(function(a,s){return a+(s.montantTotal||0);},0);
  var totalDep = todMouvs.filter(function(m){return m.type==='depense';}).reduce(function(a,m){return a+m.montant;},0);
  var totalEnc = todMouvs.filter(function(m){return m.type==='encaissement_credit'||m.type==='encaissement_depot'||m.type==='vente_offline_sync';}).reduce(function(a,m){return a+m.montant;},0);
  var si=todMouvs.filter(function(m){return m.type==='solde_init';});
  var soldeInit=si.length?si[si.length-1].montant:0;
  var caisseTheorique = soldeInit + totalVentes + totalEnc - totalDep;

  if(confirm('Cloturer la journee ?\n'+nbVentes+' vente(s) - '+fmt(totalVentes)+' FG\n\nCela enverra un resume au patron par WhatsApp.')){
    db.collection('clotures').add({
      gestionnaire: SESSION.nom,
      nbVentes: nbVentes, totalVentes: totalVentes,
      totalDepenses: totalDep, totalEncaissements: totalEnc,
      caisseTheorique: caisseTheorique,
      date: firebase.firestore.Timestamp.now(),
      statut: 'cloture'
    }).then(function(){
      showToast('Journee cloturee !');
      var msg = 'CLOTURE ZAG GROUP\n'+new Date().toLocaleDateString('fr-FR')+'\nPar: '+SESSION.nom+'\n\n'
        +'Ventes: '+nbVentes+' ('+fmt(totalVentes)+' FG)\n'
        +'Depenses caisse: '+fmt(totalDep)+' FG\n'
        +'Encaissements credits/depots: '+fmt(totalEnc)+' FG\n'
        +'Caisse theorique: '+fmt(caisseTheorique)+' FG';
      setTimeout(function(){
        window.open('https://wa.me/224626207646?text='+encodeURIComponent(msg),'_blank');
      }, 400);
    }).catch(function(e){ showToast(e.message, true); });
  }
}

function creditEnRetard(c){
  return c.statut==='en_cours' && c.date_echeance && c.date_echeance.toDate && c.date_echeance.toDate() < new Date();
}

function gcRenderCredits(){
  var el = document.getElementById('gc-list');
  if(!el) return;
  var nom = SESSION.nom ? SESSION.nom.trim().toLowerCase() : '';
  var f = credits_g.filter(function(c){ return !c.gestionnaire || (c.gestionnaire.trim().toLowerCase()===nom); });
  if(gcFilter==='en_cours') f=f.filter(function(c){return c.statut==='en_cours'&&!creditEnRetard(c);});
  else if(gcFilter==='en_retard') f=f.filter(creditEnRetard);
  else if(gcFilter==='solde') f=f.filter(function(c){return c.statut==='solde';});
  var totalDu = f.filter(function(c){return c.statut!=='solde';}).reduce(function(s,c){return s+(c.montant_restant||0);},0);
  var tbar = document.getElementById('gc-total-bar');
  if(tbar){ tbar.style.display=totalDu>0?'flex':'none'; }
  var tval = document.getElementById('gc-total-val');
  if(tval) tval.textContent = fmt(totalDu)+' FG';
  if(!f.length){ el.innerHTML='<div class="ca-empty">Aucun credit dans cette categorie</div>'; return; }
  var html='';
  f.forEach(function(c){
    var retard=creditEnRetard(c), solde=c.statut==='solde';
    var pct=c.montant_total>0?Math.round((c.montant_paye||0)/c.montant_total*100):0;
    var pillCls=solde?'pill-solde':retard?'pill-retard':'pill-cours';
    var pillTxt=solde?'Solde':retard?'En retard':'En cours';
    html+='<div class="ca-card'+(retard?' retard':'')+(solde?' solde':'')+'">';
    html+='<div class="ca-row"><span class="ca-client">'+escapeHtml(c.client_nom)+'</span><span class="ca-pill '+pillCls+'">'+pillTxt+'</span></div>';
    if(c.articles) html+='<div class="ca-meta">'+escapeHtml(c.articles)+'</div>';
    html+='<div class="ca-amounts">';
    html+='<span class="ca-amt ca-amt-total">Total: '+fmt(c.montant_total)+'</span>';
    if(!solde) html+='<span class="ca-amt ca-amt-rest">Reste: '+fmt(c.montant_restant)+'</span>';
    html+='<span class="ca-amt ca-amt-paye">Paye: '+fmt(c.montant_paye||0)+'</span>';
    html+='</div>';
    html+='<div class="ca-prog"><div class="ca-prog-fill" style="width:'+pct+'%"></div></div>';
    if(!solde){
      html+='<div class="ca-btns">';
      html+='<button class="ca-btn ca-btn-pay" onclick="gcOpenPmt(\''+c.id+'\')">&#128176; Paiement</button>';
      html+='<button class="ca-btn ca-btn-wa" onclick="gcRelanceWA(\''+c.id+'\')">&#128241; Relance</button>';
      html+='</div>';
    }
    html+='</div>';
  });
  el.innerHTML=html;
}

function gcEnregistrerPmt(){
  if(!gcPmtId) return;
  var c=credits_g.find(function(x){return x.id===gcPmtId;});
  if(!c) return;
  var montant=parseFloat(document.getElementById('gcPmtMontant').value)||0;
  if(montant<=0){ document.getElementById('gcPmtErr').textContent='Montant invalide'; return; }
  if(montant>c.montant_restant){ document.getElementById('gcPmtErr').textContent='Depasse le solde restant'; return; }
  var pmts=c.paiements||[];
  pmts.push({montant:montant,date:new Date().toISOString(),par:SESSION.nom,type:'paiement'});
  var nPaye=(c.montant_paye||0)+montant;
  var nRest=c.montant_restant-montant;
  var nStatut=nRest<=0?'solde':'en_cours';
  db.collection('credits').doc(gcPmtId).update({
    montant_paye:nPaye, montant_restant:nRest, statut:nStatut, paiements:pmts
  }).then(function(){
    db.collection('mouvements_caisse').add({
      type:'encaissement_credit', montant:montant,
      motif:'Remboursement credit - '+c.client_nom, gestionnaire:SESSION.nom,
      ref:gcPmtId, date:firebase.firestore.Timestamp.now()
    }).catch(function(){});
    showToast(nStatut==='solde'?'Credit solde !':'Paiement enregistre !');
    closeOv('ovGCPmt'); gcPmtId=null;
  }).catch(function(){ showToast('Erreur', true); });
}

// ===== SYNC VENTES HORS-LIGNE =====
function syncLocalSorties(){
  if(!FIREBASE_OK || !navigator.onLine) return;
  var sl=[];
  try{ sl=JSON.parse(localStorage.getItem('zag_sorties_pending')||'[]'); }catch(e){ return; }
  var pending = sl.filter(function(s){ return s._synced===false; });
  if(!pending.length) return;

  var synced = 0;
  pending.forEach(function(s){
    var data = Object.assign({}, s);
    delete data._localId; delete data._synced;
    // Conserver la date originale si possible, sinon now()
    if(s._originalDate){
      try{ data.date = firebase.firestore.Timestamp.fromMillis(s._originalDate); }
      catch(e){ data.date = firebase.firestore.Timestamp.now(); }
    } else {
      data.date = firebase.firestore.Timestamp.now();
    }
    // Transaction : vérification stock + écriture atomique (protection multi-appareils)
    (function(sData, localId){
      var prodRef = sData.produitId ? db.collection('produits').doc(sData.produitId) : null;
      var doSync = function(){
        db.collection('sorties').add(sData).then(function(){
          // mouvements_caisse (vente_offline_sync)
          db.collection('mouvements_caisse').add({
            type: 'vente_offline_sync',
            montant: sData.montantTotal||0,
            motif: 'Sync vente hors-ligne - '+(sData.produitNom||''),
            ref: sData.recu||'',
            gestionnaire: sData.gestionnaire||SESSION.nom,
            date: firebase.firestore.Timestamp.now()
          }).catch(function(){});
          synced++;
          var arr=[];try{arr=JSON.parse(localStorage.getItem('zag_sorties_pending')||'[]');}catch(ex){}
          arr = arr.filter(function(x){ return x._localId!==localId; });
          try{localStorage.setItem('zag_sorties_pending',JSON.stringify(arr));}catch(ex){}
          if(synced===pending.length){
            showToast('✅ '+synced+' vente(s) synchronisée(s) !');
            updateSyncBanner();
          }
        }).catch(function(){});
      };
      if(prodRef){
        // Transaction pour vérifier et décrémenter le stock atomiquement
        db.runTransaction(function(transaction){
          return transaction.get(prodRef).then(function(doc){
            var stockReel = doc.exists ? (doc.data().stock||0) : 0;
            var qte = sData.quantite||1;
            if(stockReel < qte){
              throw new Error('Stock insuffisant pour sync: '+sData.produitNom+' (stock: '+stockReel+', demande: '+qte+')');
            }
            transaction.update(prodRef, {stock: stockReel - qte});
          });
        }).then(function(){
          doSync();
        }).catch(function(e){
          // Stock insuffisant : rejeter cette vente hors-ligne
          showToast('⚠️ Vente annulée ('+sData.produitNom+'): '+e.message, true);
          var arr=[];try{arr=JSON.parse(localStorage.getItem('zag_sorties_pending')||'[]');}catch(ex){}
          arr = arr.filter(function(x){ return x._localId!==localId; });
          try{localStorage.setItem('zag_sorties_pending',JSON.stringify(arr));}catch(ex){}
          synced++; // compter quand même pour savoir quand on a fini
          if(synced===pending.length){ updateSyncBanner(); }
        });
      } else {
        doSync();
      }
    })(data, s._localId);
  });
}

// ===== SYNC ENTREES HORS-LIGNE =====
function syncLocalEntrees(){
  if(!FIREBASE_OK || !navigator.onLine) return;
  var el=[];
  try{ el=JSON.parse(localStorage.getItem('zag_entrees_pending')||'[]'); }catch(e){ return; }
  var pending=el.filter(function(x){return x._synced===false;});
  if(!pending.length) return;

  var synced=0;
  pending.forEach(function(x){
    var data=Object.assign({},x);
    delete data._localId; delete data._synced;
    data.date=firebase.firestore.Timestamp.now();
    db.collection('entrees').add(data).then(function(){
      if(x.produitId){
        db.collection('produits').doc(x.produitId).update({
          stock: firebase.firestore.FieldValue.increment(x.quantite||0),
          prixAchat: x.prixUnitaire
        }).catch(function(){});
      }
      synced++;
      var arr=[];try{arr=JSON.parse(localStorage.getItem('zag_entrees_pending')||'[]');}catch(ex){}
      arr=arr.filter(function(y){return y._localId!==x._localId;});
      try{localStorage.setItem('zag_entrees_pending', JSON.stringify(arr));}catch(ex){}
      if(synced===pending.length){
        showToast('✅ '+synced+' entrée(s) synchronisée(s) avec Firebase !');
        updateSyncBanner();
      }
    }).catch(function(){});
  });
}

function getPendingEntreesCount(){
  try{
    var el=JSON.parse(localStorage.getItem('zag_entrees_pending')||'[]');
    return el.filter(function(x){return x._synced===false;}).length;
  }catch(e){return 0;}
}

function getPendingVentesCount(){
  try{
    var sl=JSON.parse(localStorage.getItem('zag_sorties_pending')||'[]');
    return sl.filter(function(s){return s._synced===false;}).length;
  }catch(e){return 0;}
}

function updateSyncBanner(){
  var banner = document.getElementById('syncBanner');
  var countEl = document.getElementById('syncCount');
  var statusEl = document.getElementById('syncStatus');
  if(!banner) return;
  var online = navigator.onLine;
  var pendingV = getPendingVentesCount();
  var pendingE = getPendingEntreesCount();
  var pending = pendingV + pendingE;
  function libelle(n){
    var parts=[];
    if(pendingV>0) parts.push(pendingV+' vente(s)');
    if(pendingE>0) parts.push(pendingE+' entrée(s)');
    return parts.join(' + ');
  }
  if(!online){
    banner.style.display='flex';
    banner.style.background='linear-gradient(135deg,#333,#222)';
    if(countEl) countEl.textContent='\uD83D\uDCF4 Hors-ligne'+(pending>0?' \u2014 '+libelle()+' en attente':'');
    if(statusEl){statusEl.style.display='block';statusEl.textContent='Sync automatique au retour de la connexion';}
  } else if(pending>0){
    banner.style.display='flex';
    banner.style.background='linear-gradient(135deg,#e65100,#ff6d00)';
    if(countEl) countEl.textContent='\u23F3 '+libelle()+' \u00e0 synchroniser';
    if(statusEl){statusEl.style.display='block';statusEl.textContent='Synchronisation en cours...';}
    setTimeout(syncLocalSorties, 1500);
    setTimeout(syncLocalEntrees, 1500);
  } else {
    banner.style.display='none';
  }
}

window.addEventListener('online', function(){
  updateSyncBanner();
  setTimeout(syncLocalSorties, 1000);
  setTimeout(syncLocalEntrees, 1000);
});
window.addEventListener('offline', function(){ updateSyncBanner(); });
setInterval(function(){
  if(navigator.onLine && getPendingVentesCount()>0) syncLocalSorties();
  if(navigator.onLine && getPendingEntreesCount()>0) syncLocalEntrees();
  updateSyncBanner();
}, 30000);

// ══ BOOT — Firebase via zag-shared.js ══
window.addEventListener('DOMContentLoaded', function(){
  window.initFirebase(
    function(database){ // Firebase OK
      db = ZAG.db = database;
      FIREBASE_OK = ZAG.FIREBASE_OK = true;
      if(!_appDemarre){ _appDemarre = true; demarrer(); }
    },
    function(){ // Mode hors-ligne
      db = ZAG.db = createFakeDb();
      FIREBASE_OK = false;
      if(!_appDemarre){ _appDemarre = true; demarrer(); }
    }
  );
});
</script>
